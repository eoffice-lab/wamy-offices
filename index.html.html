/* ============================================================================
   تقرير الأداء — صفحة A4 بهوية الندوة، تُحفظ PDF من نافذة الطباعة
   ============================================================================ */
let rpPrevTheme = null;

function openPerfReport(){
  rpPrevTheme = document.documentElement.dataset.theme || 'light';
  document.documentElement.dataset.theme = 'light';   // التقرير دائماً بالوضع الفاتح
  $('#reportRoot').innerHTML = buildPerfReport();
  document.body.classList.add('reporting');
  $('#rpPrint').onclick = ()=>window.print();
  $('#rpClose').onclick = closePerfReport;
  // الرسوم بعرض صفحة A4
  const w1 = $('#rpC1'), w2 = $('#rpC2');
  const rows = S.offices.filter(o=>officeTotal(o)>0).sort((a,b)=>officeTotal(b)-officeTotal(a)).slice(0,14);
  stackedBars(w1, rows.map(o=>({label:officeLabel(o), sub:o.country, total:officeTotal(o),
      parts:[{name:'النصف الأول',v:Number(o.h1)||0,color:'#1E88C7'},
             {name:'النصف الثاني',v:Number(o.h2)||0,color:'#EB6834'}]})), {rowH:26, barH:13});
  const rr = S.offices.filter(o=>ratio(o)!=null && ratio(o)>0).map(o=>({label:officeLabel(o), v:ratio(o)}))
             .sort((a,b)=>b.v-a.v).slice(0,14);
  const avg = rr.length ? rr.reduce((s,x)=>s+x.v,0)/rr.length : null;
  dotChart(w2, rr, {ref:avg, refLabel:'المتوسط', rowH:24});
  $('#reportRoot').scrollTop = 0;
}
function closePerfReport(){
  document.body.classList.remove('reporting');
  $('#reportRoot').innerHTML = '';
  if(rpPrevTheme) document.documentElement.dataset.theme = rpPrevTheme;
  runCharts();
}

function buildPerfReport(){
  const t = totals();
  const offices = S.offices.slice().sort((a,b)=>officeTotal(b)-officeTotal(a));
  const withBudget = offices.filter(o=>officeTotal(o)>0);
  const noBudget   = offices.filter(o=>officeTotal(o)===0);
  const noReports  = offices.filter(o=>!(o.reports||[]).length);
  const highRatio  = offices.filter(o=>{const r=ratio(o); return r!=null && r>85;});
  const midRatio   = offices.filter(o=>{const r=ratio(o); return r!=null && r>65 && r<=85;});
  const countries  = new Set(offices.map(o=>(o.country||'').trim()).filter(Boolean));
  const avgBudget  = withBudget.length ? t.total/withBudget.length : 0;
  const topStaff   = offices.filter(o=>(o.employees||[]).length).sort((a,b)=>payrollAnnual(b)-payrollAnnual(a)).slice(0,8);
  const now = new Date();
  const dateStr = now.toLocaleDateString('ar-EG-u-nu-latn-ca-gregory',{year:'numeric',month:'long',day:'numeric'});
  const balance = t.total ? Math.abs(t.h1 - t.h2)/t.total*100 : 0;
  const tblRows = offices.filter(o=>officeTotal(o)>0 || (o.employees||[]).length>0);
  const skipped = offices.filter(o=>!(officeTotal(o)>0 || (o.employees||[]).length>0));

  const flag = (color, title, body) =>
    `<div class="rp-flag"><i style="background:${color}"></i><div><b>${title}</b> ${body}</div></div>`;

  return `
  <div class="rp-bar no-print">
    <span class="t">تقرير الأداء — معاينة قبل الحفظ</span>
    <button class="btn btn-sm btn-primary" id="rpPrint">${IC.print} طباعة / حفظ PDF</button>
    <button class="btn btn-sm" id="rpClose">${IC.x} إغلاق</button>
  </div>

  <div class="rp-page">
    <header class="rp-head">
      <div class="lg">${S.meta.logo ? `<img src="${S.meta.logo}" alt="">` : LOGO_SVG}</div>
      <div>
        <div class="org">${esc(S.meta.org)}</div>
        <div class="unit">${esc(S.meta.unit)}</div>
      </div>
      <div class="mt">
        <div>السنة المالية: <b>${esc(S.meta.year)}</b></div>
        <div>تاريخ الإصدار: <b>${esc(dateStr)}</b></div>
        <div>العملة: <b>${esc(CUR())}</b></div>
      </div>
    </header>

    <div class="rp-title">تقرير الأداء — قسم المكاتب الدولية</div>
    <div class="rp-title-sub">ملخّص تنفيذي للمكاتب والميزانيات التشغيلية والموارد البشرية</div>

    <div class="rp-h2">١ — الملخّص التنفيذي</div>
    <p class="rp-p">
      يشرف قسم المكاتب الدولية على <b>${num(offices.length)}</b> مكتباً
      ${countries.size ? `موزّعة على <b>${num(countries.size)}</b> دولة` : ''}،
      أُدخلت الميزانية التشغيلية لـ <b>${num(withBudget.length)}</b> منها بإجمالي
      <b>${num(t.total)} ${esc(CUR())}</b> للسنة المالية ${esc(S.meta.year)}؛
      منها <b>${num(t.h1)}</b> للنصف الأول (${t.total?pct(t.h1/t.total*100):'—'})
      و <b>${num(t.h2)}</b> للنصف الثاني (${t.total?pct(t.h2/t.total*100):'—'}).
      ويعمل في المكاتب <b>${num(t.staff)}</b> موظفاً بإجمالي رواتب سنوية
      <b>${num(t.payroll)} ${esc(CUR())}</b>${t.ratio!=null?`، أي ما يمثّل <b>${pct(t.ratio)}</b> من إجمالي الميزانية التشغيلية`:''}.
      ${withBudget.length?`ويبلغ متوسط ميزانية المكتب <b>${num(avgBudget)} ${esc(CUR())}</b>.`:''}
      ${noBudget.length?`ولا تزال <b>${num(noBudget.length)}</b> مكتباً بحاجة إلى اعتماد ميزانيتها.`:''}
    </p>

    <div class="rp-kpis">
      ${rpKpi('إجمالي الميزانية التشغيلية', num(t.total), CUR())}
      ${rpKpi('ميزانية النصف الأول', num(t.h1), CUR())}
      ${rpKpi('ميزانية النصف الثاني', num(t.h2), CUR())}
      ${rpKpi('إجمالي الرواتب السنوية', num(t.payroll), CUR())}
      ${rpKpi('نسبة الرواتب من الميزانية', t.ratio!=null?nf1.format(t.ratio):'—', '%')}
      ${rpKpi('عدد الموظفين', num(t.staff), 'موظف')}
      ${rpKpi('عدد المكاتب', num(offices.length), 'مكتب')}
      ${rpKpi('مكاتب مكتملة البيانات', num(t.filled), 'مكتب')}
      ${rpKpi('التقارير المستلمة', num(t.reports), 'تقرير')}
    </div>

    <div class="rp-h2">٢ — الميزانيات التشغيلية حسب المكتب</div>
    <p class="rp-p">
      يوضّح الرسم أدناه توزيع الميزانية التشغيلية لأكبر ${num(Math.min(14,withBudget.length))} مكتباً،
      مفصولةً بين النصف الأول والنصف الثاني.
      ${balance<=10?`ويظهر توازناً معقولاً بين النصفين (فرق ${nf1.format(balance)}% من الإجمالي).`
       :`ويُلاحظ تفاوت بين النصفين بمقدار ${nf1.format(balance)}% من الإجمالي، ويُستحسن مراجعة أسباب التفاوت.`}
    </p>
    <div class="rp-avoid" id="rpC1" style="margin-bottom:6px"></div>
    <div class="rp-note">القيم بـ${esc(CUR())}. الأعمدة مرتّبة تنازلياً حسب الإجمالي.</div>

    <div class="rp-h2">٣ — جدول الميزانيات التشغيلية</div>
    <table class="rp-tbl">
      <thead><tr>
        <th style="width:32px">م</th><th>المكتب</th><th>الدولة</th>
        <th class="n">النصف الأول</th><th class="n">النصف الثاني</th><th class="n">الإجمالي</th>
        <th class="n">الرواتب/سنة</th><th class="n">النسبة</th><th class="n">موظفون</th><th class="n">تقارير</th>
      </tr></thead>
      <tbody>${tblRows.map((o,i)=>{const r=ratio(o);return `<tr>
        <td style="color:#78899E">${i+1}</td>
        <td style="font-weight:600">${esc(officeLabel(o))}</td>
        <td>${esc(o.country||'—')}</td>
        <td class="n">${num(o.h1)}</td><td class="n">${num(o.h2)}</td>
        <td class="n" style="font-weight:700">${num(officeTotal(o))}</td>
        <td class="n">${num(payrollAnnual(o))}</td>
        <td class="n">${r!=null?nf1.format(r)+'%':'—'}</td>
        <td class="n">${num((o.employees||[]).length)}</td>
        <td class="n">${num((o.reports||[]).length)}</td></tr>`}).join('')}</tbody>
      <tfoot><tr>
        <td></td><td>الإجمالي</td><td></td>
        <td class="n">${num(t.h1)}</td><td class="n">${num(t.h2)}</td><td class="n">${num(t.total)}</td>
        <td class="n">${num(t.payroll)}</td><td class="n">${t.ratio!=null?nf1.format(t.ratio)+'%':'—'}</td>
        <td class="n">${num(t.staff)}</td><td class="n">${num(t.reports)}</td></tr></tfoot>
    </table>
    ${skipped.length?`<div class="rp-note">لم تُدرَج ${num(skipped.length)} مكتباً في الجدول لعدم إدخال ميزانيتها أو موظفيها بعد: ${esc(skipped.map(officeLabel).join('، '))}.</div>`:''}

    <div class="rp-h2">٤ — الموارد البشرية ونسبة الرواتب</div>
    <p class="rp-p">
      إجمالي الرواتب السنوية <b>${num(t.payroll)} ${esc(CUR())}</b> لعدد <b>${num(t.staff)}</b> موظفاً،
      بمتوسط <b>${num(t.staff?t.payroll/t.staff:0)} ${esc(CUR())}</b> سنوياً للموظف.
      ${highRatio.length?`وتتجاوز نسبة الرواتب من الميزانية <b>٨٥٪</b> في <b>${num(highRatio.length)}</b> مكتباً، وهو مؤشر يستدعي المراجعة.`
        :`ولا يوجد مكتب تتجاوز فيه نسبة الرواتب ٨٥٪ من ميزانيته.`}
    </p>
    <div class="rp-avoid" id="rpC2" style="margin-bottom:14px"></div>
    ${topStaff.length?`<table class="rp-tbl rp-avoid">
      <thead><tr><th>المكتب</th><th class="n">عدد الموظفين</th><th class="n">الرواتب السنوية</th>
        <th class="n">الميزانية</th><th class="n">النسبة</th></tr></thead>
      <tbody>${topStaff.map(o=>{const r=ratio(o);return `<tr>
        <td style="font-weight:600">${esc(officeLabel(o))}</td>
        <td class="n">${num((o.employees||[]).length)}</td>
        <td class="n">${num(payrollAnnual(o))}</td>
        <td class="n">${num(officeTotal(o))}</td>
        <td class="n">${r!=null?nf1.format(r)+'%':'—'}</td></tr>`}).join('')}</tbody></table>`:''}

    <div class="rp-h2">٥ — حالة التقارير والملاحظات</div>
    <div class="rp-flags">
      ${flag('#0CA30C','التقارير المستلمة:', `${num(t.reports)} تقرير من ${num(t.withReports)} مكتباً.`)}
      ${noReports.length?flag('#FAB219','مكاتب لم تُستلم تقاريرها:', `${num(noReports.length)} مكتب — ${esc(noReports.slice(0,10).map(officeLabel).join('، '))}${noReports.length>10?' وغيرها':''}.`):''}
      ${noBudget.length?flag('#EC835A','مكاتب بلا ميزانية معتمدة:', `${num(noBudget.length)} مكتب — ${esc(noBudget.slice(0,10).map(officeLabel).join('، '))}${noBudget.length>10?' وغيرها':''}.`):''}
      ${highRatio.length?flag('#D03B3B','نسبة رواتب مرتفعة (أعلى من ٨٥٪):', esc(highRatio.map(o=>officeLabel(o)+' '+nf1.format(ratio(o))+'%').join('، '))+'.'):''}
      ${midRatio.length?flag('#FAB219','نسبة رواتب متوسطة (٦٥٪–٨٥٪):', esc(midRatio.map(o=>officeLabel(o)).join('، '))+'.'):''}
    </div>

    <div class="rp-sign">
      <div>مدير قسم المكاتب الدولية</div>
      <div>مدير إدارة المكاتب والعلاقات الدولية</div>
    </div>

    <div class="rp-foot">
      <span>${esc(S.meta.org)} — ${esc(S.meta.unit)}</span>
      <span style="margin-inline-start:auto">تقرير الأداء · ${esc(dateStr)}</span>
    </div>
  </div>`;
}
function rpKpi(k,v,u){
  return `<div class="rp-kpi"><div class="k">${esc(k)}</div><div class="v">${esc(v)} <small>${esc(u)}</small></div></div>`;
}

/* --------------------------------------------------------------- إقلاع */
(async function init(){
  try{ const th = localStorage.getItem(KEY+'.theme'); if(th) document.documentElement.dataset.theme = th; }catch(e){}
  document.documentElement.classList.add('ro');       // نسخة الويب: عرض فقط
  S = defaultState();
  await FileStore.init();
  paintLogo();
  paintSaveState();
  paintSync('load','جارٍ التحميل…');
  render();
  const okp = new URLSearchParams(location.search);
  ['staff','budgets','reports'].forEach(k=>{ const v=okp.get(k); if(v) SHEET_URLS[k]=v; });
  await syncFromSheet(false);
  if(!SHEET_URLS.staff) paintSync('err','بيانات مدمجة');
  setInterval(()=>syncFromSheet(false), AUTO_REFRESH_MINUTES*60*1000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncFromSheet(false); });
})();
</script>
</body>
</html>
