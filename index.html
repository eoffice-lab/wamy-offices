<script>
/* ============================================================================
   الرسوم البيانية — SVG مبني يدوياً (بلا مكتبات خارجية)
   القواعد: محور واحد، ألوان ثابتة لكل سلسلة، فاصل 2px بين الأجزاء،
   تسميات مباشرة على أطراف الأعمدة، تلميح عند المرور، وبديل جدولي.
   ============================================================================ */
"use strict";

const TIP = () => $('#tip');
function tipShow(html, ev){
  const t = TIP(); t.innerHTML = html; t.classList.add('on');
  const pad = 14, w = t.offsetWidth, h = t.offsetHeight;
  let x = ev.clientX - w - pad; if(x < 8) x = ev.clientX + pad;
  let y = ev.clientY - h - pad; if(y < 8) y = ev.clientY + pad;
  t.style.left = x+'px'; t.style.top = y+'px';
}
function tipHide(){ TIP().classList.remove('on'); }

/* ---------------------------------------------- أعمدة أفقية مكدّسة (RTL) */
/* rows: [{label, sub, parts:[{v,color,name}], total}] — تنمو الأعمدة من اليمين لليسار */
function stackedBars(host, rows, opts){
  opts = Object.assign({ labelW:158, rowH:32, barH:15, maxRows:99, valueFmt:compact, tipFmt:null }, opts||{});
  const W = Math.max(320, host.clientWidth || host.getBoundingClientRect().width || 640);
  const data = rows.slice(0, opts.maxRows);
  if(!data.length){ host.innerHTML = emptyBlock('لا توجد بيانات ميزانية بعد'); return; }

  const labelW = W < 560 ? 116 : opts.labelW;
  const valW   = W < 560 ? 62 : 78;
  const x1 = W - labelW - 16;          // حد العمود الأيمن (نقطة الصفر)
  const x0 = valW + 6;                 // أقصى امتداد لليسار
  const plotW = Math.max(40, x1 - x0);
  const max = Math.max(1, ...data.map(r=>r.total));
  const H = data.length * opts.rowH + 26;

  let ticks = '';
  const step = niceStep(max, 4);
  for(let v = 0; v <= max + 1e-9; v += step){
    const x = x1 - (v/max)*plotW;
    ticks += `<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${H-24}" stroke="var(--grid)" stroke-width="1"/>`
          +  `<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" class="axis-txt">${esc(compact(v))}</text>`;
  }

  let bars = '';
  data.forEach((r,i)=>{
    const cy = i*opts.rowH + opts.rowH/2;
    const yb = cy - opts.barH/2;
    let cursor = x1;
    const segs = r.parts.filter(p=>(Number(p.v)||0) > 0);
    segs.forEach((p,pi)=>{
      let w = (Number(p.v)/max)*plotW;
      if(pi < segs.length-1) w = Math.max(0, w - 2);   // فاصل 2px بلون السطح
      const isEnd = pi === segs.length-1;
      bars += barPath(cursor - w, yb, Math.max(1.5,w), opts.barH, isEnd ? 4 : 0, p.color, `data-r="${i}" data-p="${pi}"`);
      cursor -= (Number(p.v)/max)*plotW;
    });
    const endX = x1 - (r.total/max)*plotW;
    bars += `<text x="${(endX-7).toFixed(1)}" y="${(cy+4).toFixed(1)}" text-anchor="end" class="bar-lab">${esc(opts.valueFmt(r.total))}</text>`;
    bars += `<text x="${W-4}" y="${(cy+1).toFixed(1)}" text-anchor="end" font-size="12.5" font-weight="500" fill="var(--text-primary)">${esc(trim(r.label, labelW<130?12:19))}</text>`;
    if(r.sub) bars += `<text x="${W-4}" y="${(cy+13).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--text-muted)">${esc(trim(r.sub,22))}</text>`;
    bars += `<rect x="${x0}" y="${(cy-opts.rowH/2).toFixed(1)}" width="${(W-x0)}" height="${opts.rowH}" fill="transparent" data-row="${i}" style="cursor:default"/>`;
  });

  host.innerHTML = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" height="${H}" role="img">
    <line x1="${x1}" y1="0" x2="${x1}" y2="${H-24}" stroke="var(--axis)" stroke-width="1"/>
    ${ticks}${bars}</svg>`;

  host.querySelectorAll('[data-row]').forEach(el=>{
    const r = data[+el.dataset.row];
    el.addEventListener('mousemove', ev=>{
      const inner = r.parts.map(p=>`<div class="r"><span><i class="dot" style="background:${p.color}"></i> ${esc(p.name)}</span><span class="v">${esc(num(p.v))}</span></div>`).join('');
      tipShow(`<b>${esc(r.label)}</b>${inner}<div class="r" style="border-top:1px solid rgba(255,255,255,.18);margin-top:5px;padding-top:5px"><span>الإجمالي</span><span class="v">${esc(num(r.total))} ${esc(CUR())}</span></div>`, ev);
    });
    el.addEventListener('mouseleave', tipHide);
  });
}

/* ---------------------------------------------------- مخطط نقاط (نسبة) */
/* rows: [{label, v, color?}] قيمة واحدة لكل صف + خط مرجعي */
function dotChart(host, rows, opts){
  opts = Object.assign({ labelW:158, rowH:27, refLabel:'المتوسط', suffix:'%', max:null, ref:null }, opts||{});
  const W = Math.max(320, host.clientWidth || 640);
  if(!rows.length){ host.innerHTML = emptyBlock('لا توجد بيانات كافية لحساب النسبة'); return; }
  const labelW = W < 560 ? 116 : opts.labelW;
  const x1 = W - labelW - 10, x0 = 46, plotW = Math.max(40, x1 - x0);
  const max = opts.max || Math.max(10, ...rows.map(r=>r.v)) * 1.08;
  const padT = (opts.ref!=null?20:8);
  const H = rows.length*opts.rowH + 26 + padT;
  const px = v => x1 - (Math.min(v,max)/max)*plotW;

  let ticks='';
  const step = niceStep(max, 4);
  for(let v=0; v<=max+1e-9; v+=step){
    const x = px(v);
    ticks += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${H-24}" stroke="var(--grid)" stroke-width="1"/>`
          +  `<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" class="axis-txt">${Math.round(v)}${esc(opts.suffix)}</text>`;
  }
  let ref='';
  if(opts.ref!=null && isFinite(opts.ref)){
    const x = px(opts.ref);
    ref = `<line x1="${x.toFixed(1)}" y1="${padT-4}" x2="${x.toFixed(1)}" y2="${H-24}" stroke="var(--navy-soft)" stroke-width="1.5" stroke-dasharray="4 3"/>
           <text x="${(x-4).toFixed(1)}" y="${padT-7}" text-anchor="end" font-size="10.5" fill="var(--text-secondary)" font-weight="600">${esc(opts.refLabel)} ${nf1.format(opts.ref)}${esc(opts.suffix)}</text>`;
  }
  let marks='';
  rows.forEach((r,i)=>{
    const cy = i*opts.rowH + opts.rowH/2 + padT + 2;
    const x = px(r.v);
    const c = r.color || 'var(--series-1)';
    marks += `<line x1="${x1}" y1="${cy}" x2="${x.toFixed(1)}" y2="${cy}" stroke="${c}" stroke-width="2" opacity=".38"/>`;
    marks += `<circle data-mark="1" cx="${x.toFixed(1)}" cy="${cy}" r="5.5" fill="${c}" stroke="var(--surface-1)" stroke-width="2"/>`;
    const flip = (x - 11 - 42) < x0;
    marks += `<text x="${(flip? x+11 : x-11).toFixed(1)}" y="${cy+4}" text-anchor="${flip?'start':'end'}" class="bar-lab">${nf1.format(r.v)}${esc(opts.suffix)}</text>`;
    marks += `<text x="${W-4}" y="${cy+4}" text-anchor="end" font-size="12.5" fill="var(--text-primary)">${esc(trim(r.label, labelW<130?12:19))}</text>`;
    marks += `<rect x="${x0}" y="${cy-opts.rowH/2}" width="${W-x0}" height="${opts.rowH}" fill="transparent" data-row="${i}"/>`;
  });
  host.innerHTML = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" height="${H}" role="img">
    <line x1="${x1}" y1="${padT}" x2="${x1}" y2="${H-24}" stroke="var(--axis)" stroke-width="1"/>${ticks}${ref}${marks}</svg>`;
  host.querySelectorAll('[data-row]').forEach(el=>{
    const r = rows[+el.dataset.row];
    el.addEventListener('mousemove', ev=>tipShow(`<b>${esc(r.label)}</b>${esc(r.tip||('النسبة: '+nf1.format(r.v)+opts.suffix))}`, ev));
    el.addEventListener('mouseleave', tipHide);
  });
}

/* ------------------------------------------------------ أعمدة رأسية بسيطة */
function columnChart(host, rows, opts){
  opts = Object.assign({ color:'var(--series-1)', h:190 }, opts||{});
  const W = Math.max(320, host.clientWidth || 640), H = opts.h;
  if(!rows.length){ host.innerHTML = emptyBlock('لا توجد بيانات'); return; }
  const padB = 40, padT = 22, x0 = 74, x1 = W - 8;
  const max = Math.max(1, ...rows.map(r=>r.v));
  const step = niceStep(max,3);
  const bw = Math.min(58, (x1-x0)/rows.length - 10);
  const py = v => H - padB - (v/max)*(H-padB-padT);
  let g='';
  for(let v=0; v<=max+1e-9; v+=step){
    const y=py(v);
    g += `<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
          <text x="${x0-6}" y="${(y+4).toFixed(1)}" text-anchor="end" class="axis-txt">${esc(compact(v))}</text>`;
  }
  let bars='';
  rows.forEach((r,i)=>{
    const cx = x0 + ((x1-x0)/rows.length)*(i+0.5);
    const y = py(r.v), h = H-padB-y;
    bars += barPathV(cx-bw/2, y, bw, Math.max(2,h), 4, r.color||opts.color, `data-row="${i}"`);
    bars += `<text x="${cx.toFixed(1)}" y="${(y-7).toFixed(1)}" text-anchor="middle" class="bar-lab">${esc(compact(r.v))}</text>`;
    bars += `<text x="${cx.toFixed(1)}" y="${H-22}" text-anchor="middle" font-size="12" fill="var(--text-primary)">${esc(trim(r.label,14))}</text>`;
    if(r.sub) bars += `<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--text-muted)">${esc(r.sub)}</text>`;
  });
  host.innerHTML = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" height="${H}" role="img">${g}
    <line x1="${x0}" y1="${H-padB}" x2="${x1}" y2="${H-padB}" stroke="var(--axis)" stroke-width="1"/>${bars}</svg>`;
  host.querySelectorAll('[data-row]').forEach(el=>{
    const r = rows[+el.dataset.row];
    el.addEventListener('mousemove', ev=>tipShow(`<b>${esc(r.label)}</b><div class="r"><span>${esc(r.sub||'القيمة')}</span><span class="v">${esc(num(r.v))}</span></div>`, ev));
    el.addEventListener('mouseleave', tipHide);
  });
}

/* --------------------------------------------------------------- مساعدات */
function barPath(x,y,w,h,r,fill,attrs){
  r = Math.min(r, h/2, w);
  if(r<=0) return `<rect data-seg="1" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h}" fill="${fill}" ${attrs||''}/>`;
  // زوايا مستديرة على الطرف الأيسر (طرف النمو)
  return `<path data-seg="1" d="M ${(x+r).toFixed(1)} ${y} H ${(x+w).toFixed(1)} V ${(y+h)} H ${(x+r).toFixed(1)} A ${r} ${r} 0 0 1 ${x.toFixed(1)} ${(y+h-r).toFixed(1)} V ${(y+r).toFixed(1)} A ${r} ${r} 0 0 1 ${(x+r).toFixed(1)} ${y} Z" fill="${fill}" ${attrs||''}/>`;
}
function barPathV(x,y,w,h,r,fill,attrs){
  r = Math.min(r, w/2, h);
  return `<path data-segv="1" d="M ${x.toFixed(1)} ${(y+r).toFixed(1)} A ${r} ${r} 0 0 1 ${(x+r).toFixed(1)} ${y.toFixed(1)} H ${(x+w-r).toFixed(1)} A ${r} ${r} 0 0 1 ${(x+w).toFixed(1)} ${(y+r).toFixed(1)} V ${(y+h).toFixed(1)} H ${x.toFixed(1)} Z" fill="${fill}" ${attrs||''}/>`;
}
function niceStep(max, target){
  const raw = max/Math.max(1,target);
  const mag = Math.pow(10, Math.floor(Math.log10(raw||1)));
  const n = raw/mag;
  const m = n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;
  return m*mag;
}
function trim(s, n){ s = String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function emptyBlock(msg){
  return `<div class="empty">${IC.box}<div>${esc(msg)}</div></div>`;
}
function legend(items){
  return `<div class="legend">${items.map(i=>`<span><i class="dot" style="background:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`;
}

/* ============================================================================
   الموارد البشرية — توزيع المسميات وتغطية الوظائف الأساسية ونوع الدوام
   ============================================================================ */
const ROLES = [
  { label:'مدير المكتب',            re:/مدير\s*مكتب/ },
  { label:'محاسب',                  re:/محاسب/ },
  { label:'منسق تعليمي ودعوي',      re:/منسق\s*تعليمي|دعوي/ },
  { label:'منسق مشاريع وأيتام',     re:/منسق\s*مشاريع|ايتام|أيتام/ },
  { label:'سكرتير / إداري',         re:/سكرتير|ادار|إدار/ },
  { label:'سائق',                   re:/سائق/ },
  { label:'خدمات وصيانة وحراسة',    re:/عامل\s*خدمات|حارس|فني\s*صيانة/ }
];
const isPart = e => /جزئي/.test(e.type||'');
const hasRole = (o, re) => (o.employees||[]).some(e=>re.test(e.title||''));
function roleCoverage(offices){
  const active = offices.filter(o=>(o.employees||[]).length);
  return ROLES.map(r=>{
    const have = active.filter(o=>hasRole(o,r.re));
    const miss = active.filter(o=>!hasRole(o,r.re));
    const count = active.reduce((s,o)=>s+(o.employees||[]).filter(e=>r.re.test(e.title||'')).length,0);
    return { ...r, have, miss, count, base:active.length };
  });
}
function titleStats(){
  const m = new Map();
  allEmployees().forEach(e=>{
    const k = (e.title||'غير محدد').trim();
    const g = m.get(k) || { title:k, n:0, sal:0, offices:new Set(), part:0 };
    g.n++; g.sal += Number(e.salary)||0; g.offices.add(e._office.id); if(isPart(e)) g.part++;
    m.set(k,g);
  });
  return [...m.values()].sort((a,b)=>b.n-a.n);
}

  const cov = roleCoverage(S.offices);
  const partSal = emps.filter(isPart).reduce((s,e)=>s+(Number(e.salary)||0),0);

    ${kpi('عدد المسميات الوظيفية', num(tstats.length), 'مسمى', num(active.length)+' مكتباً عاملاً', 'k4')}

    </table></div>

  <div class="grid g-2" style="margin-bottom:18px">

<script>
/* ============================================================================
   الربط، النوافذ، التصدير/الاستيراد، الإقلاع
   ============================================================================ */
"use strict";

/* -------------------------------------------------------------- النوافذ */
let modalOnClose = null;
function openModal(title, body, foot, opts){
  if(RO() && !/تقرير/.test(title)) { toast('التعديل يتم من ملف Google Sheets فقط','info'); return document.createElement('div'); }
  const m = $('#modal');
  m.className = 'modal' + ((opts&&opts.wide)?' wide':'');
  m.innerHTML = `<div class="modal-head"><h3>${esc(title)}</h3>
      <button class="btn btn-icon btn-ghost" data-close>${IC.x}</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${foot||''}</div>`;
  $('#modalBg').classList.add('on');
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  const f = m.querySelector('input,select,textarea'); if(f) setTimeout(()=>f.focus(),40);
  return m;
}
function closeModal(){ $('#modalBg').classList.remove('on'); $('#modal').innerHTML=''; if(modalOnClose){modalOnClose();modalOnClose=null;} }
$('#modalBg').addEventListener('mousedown', e=>{ if(e.target.id==='modalBg') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

function confirmBox(title, msg, okLabel, cb, danger){
  openModal(title, `<div style="font-size:14px;line-height:1.8">${msg}</div>`,
    `<button class="btn ${danger?'btn-danger':'btn-primary'}" id="cfOk">${esc(okLabel)}</button>
     <button class="btn btn-ghost" data-close>إلغاء</button>`);
  $('#cfOk').onclick = ()=>{ closeModal(); cb(); };
}

/* ------------------------------------------------------- نموذج المكتب */
function officeForm(o){
  const isNew = !o;
  openModal(isNew?'إضافة مكتب':'تعديل بيانات المكتب', `
    <div class="form-grid">
      <div class="field"><label for="fCode">الرمز</label><input class="input" id="fCode" value="${esc(o?o.code:String(S.offices.length+1).padStart(2,'0'))}"></div>
      <div class="field"><label for="fName">اسم المكتب</label><input class="input" id="fName" value="${esc(o?o.name:'')}" placeholder="مثال: مكتب جاكرتا"></div>
      <div class="field"><label for="fCountry">الدولة</label><input class="input" id="fCountry" value="${esc(o?o.country:'')}"></div>
      <div class="field"><label for="fCity">المدينة</label><input class="input" id="fCity" value="${esc(o?o.city:'')}"></div>
      <div class="field"><label for="fMgr">مدير المكتب</label><input class="input" id="fMgr" value="${esc(o?o.manager:'')}"></div>
      <div class="field"><label for="fMail">البريد الإلكتروني</label><input class="input" id="fMail" type="email" value="${esc(o?o.email:'')}"></div>
      <div class="field"><label for="fH1">ميزانية النصف الأول</label><input class="input" id="fH1" type="number" step="any" min="0" value="${o?(Number(o.h1)||0):0}"></div>
      <div class="field"><label for="fH2">ميزانية النصف الثاني</label><input class="input" id="fH2" type="number" step="any" min="0" value="${o?(Number(o.h2)||0):0}"></div>
      <div class="field full"><label for="fNotes">ملاحظات</label><textarea class="input" id="fNotes" style="min-height:66px">${esc(o?o.notes:'')}</textarea></div>
    </div>`,
    `<button class="btn btn-primary" id="fSave">${IC.check} حفظ</button>
     <button class="btn btn-ghost" data-close>إلغاء</button>
     ${isNew?'':`<button class="btn btn-ghost btn-danger" id="fDel" style="margin-inline-start:auto">${IC.trash} حذف المكتب</button>`}`,
    {wide:true});
  $('#fSave').onclick = ()=>{
    const t = {
      code: $('#fCode').value.trim() || String(S.offices.length+1).padStart(2,'0'),
      name: $('#fName').value.trim(), country: $('#fCountry').value.trim(), city: $('#fCity').value.trim(),
      manager: $('#fMgr').value.trim(), email: $('#fMail').value.trim(),
      h1: clampNum($('#fH1').value), h2: clampNum($('#fH2').value), notes: $('#fNotes').value.trim()
    };
    if(isNew){ const n = Object.assign(blankOffice(S.offices.length+1), t); S.offices.push(n); CUR_OFFICE = n.id; }
    else Object.assign(o, t);
    save(true); closeModal(); toast(isNew?'أُضيف المكتب':'حُدّثت بيانات المكتب'); render();
  };
  if(!isNew) $('#fDel').onclick = ()=>confirmBox('حذف المكتب',
    `سيُحذف <b>${esc(officeLabel(o))}</b> مع ${num((o.employees||[]).length)} موظف و ${num((o.reports||[]).length)} تقرير. لا يمكن التراجع.`,
    'حذف نهائي', ()=>{
      (o.reports||[]).forEach(r=>r.fileId&&FileStore.del(r.fileId));
      S.offices = S.offices.filter(x=>x.id!==o.id); save(true); toast('حُذف المكتب','warn'); go('offices');
    }, true);
}

/* ------------------------------------------------------ نموذج الموظف */
function empForm(officeId, emp){
  const o = getOffice(officeId); if(!o) return;
  const isNew = !emp;
  const period = S.meta.salaryPeriod==='monthly'?'الشهري':'السنوي';

function saveBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function stamp(){ return new Date().toISOString().slice(0,10); }
function exportData(){
  saveBlob(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}), `wamy-offices-${stamp()}.json`);
  toast('تم تصدير البيانات');
}
async function exportFull(){
  toast('جارٍ تجميع الملفات…','info');
  const clone = JSON.parse(JSON.stringify(S));
  clone.__files = {};
  for(const o of clone.offices){
    for(const r of (o.reports||[])){
      if(r.kind==='file' && r.fileId){
        const b = await FileStore.get(r.fileId);
        if(b) clone.__files[r.fileId] = await blobToB64(b);
      }
    }
  }
  saveBlob(new Blob([JSON.stringify(clone)],{type:'application/json'}), `wamy-offices-full-${stamp()}.json`);
  toast('تم تصدير النسخة الكاملة');
}
const blobToB64 = b => new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(b); });
function b64ToBlob(d){
  const [h,data] = String(d).split(',');
  const mime = (h.match(/:(.*?);/)||[,'application/pdf'])[1];
  const bin = atob(data); const u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:mime});
}
function importData(){
  const inp = $('#jsonPicker'); inp.value='';
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;
    try{
      const p = JSON.parse(await f.text());
      if(!p || !Array.isArray(p.offices)) throw new Error('bad');
      const files = p.__files || {}; delete p.__files;
      confirmBox('استيراد نسخة احتياطية',
        `الملف يحتوي <b>${num(p.offices.length)}</b> مكتب و <b>${num(p.offices.reduce((s,o)=>s+((o.employees||[]).length),0))}</b> موظف`
        + (Object.keys(files).length?` و <b>${num(Object.keys(files).length)}</b> ملف تقرير`:'')
        + `.<br><br>سيُستبدل كل ما هو موجود الآن في اللوحة. صدّر نسخة أولاً إن أردت الاحتفاظ به.`,
        'استيراد واستبدال', async ()=>{
          for(const [id,d] of Object.entries(files)){ try{ await FileStore.put(id, b64ToBlob(d)); }catch(e){} }
          S = migrate(p); save(true); toast('تم الاستيراد'); go('dash');
        });
    }catch(e){ toast('الملف غير صالح','warn'); }
  };
  inp.click();
}
function csv(rows, filename){
  const body = rows.map(r=>r.map(c=>{
    const s = String(c==null?'':c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  saveBlob(new Blob(['﻿'+body],{type:'text/csv;charset=utf-8'}), filename);
  toast('تم التصدير');
}

/* ============================================================================
   طبقة الحركة — ظهور فوري متدرّج · عدّادات رقمية · نبض الخريطة · شريط التقدّم
   ملاحظة مهمة: كل المحتوى يُبنى ويظهر دفعةً واحدة عند فتح الصفحة.
   الحركة تجميلية فقط ولا ترتبط بالتمرير إطلاقاً — لا تحميل تدريجي عند النزول.
   وتحترم تفضيل النظام «تقليل الحركة».
   ============================================================================ */
const MOTION_OK = !(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

/* --------------------------------- شريط التقدّم --------------------------------- */
const LoadBar = {
  el(){ return document.querySelector('.loadbar i'); },
  start(){ const b=this.el(); if(!b) return; b.style.opacity='1'; b.style.width='18%';
           clearTimeout(this._t); this._t=setTimeout(()=>{ b.style.width='72%'; },260); },
  done(){ const b=this.el(); if(!b) return; clearTimeout(this._t); b.style.width='100%';
          setTimeout(()=>{ b.style.opacity='0'; setTimeout(()=>{ b.style.width='0'; },420); },240); }
};

/* --------------------------------- العدّاد الرقمي --------------------------------- */
function countUp(el, delay){
  if(!el || el.dataset.counted) return;
  const raw = el.textContent;
  const m = raw.match(/^([^\d\-]*)(-?\d[\d,]*(?:\.\d+)?)([\s\S]*)$/);
  if(!m){ el.dataset.counted = '1'; return; }
  const pre = m[1], numStr = m[2], post = m[3];
  const target = parseFloat(numStr.replace(/,/g,''));
  if(!isFinite(target)){ el.dataset.counted='1'; return; }
  el.dataset.counted = '1';
  const decF = (numStr.split('.')[1]||'').length;
  const finalTxt = pre + new Intl.NumberFormat('en-US',{minimumFractionDigits:decF,maximumFractionDigits:decF,
                     useGrouping:numStr.includes(',')}).format(target) + post;
  el.dataset.final = finalTxt;
  if(!MOTION_OK || target === 0) return;
  const dec = (numStr.split('.')[1]||'').length;
  const grouped = numStr.includes(',');
  const fmt = new Intl.NumberFormat('en-US',{ minimumFractionDigits:dec, maximumFractionDigits:dec,
                                              useGrouping: grouped });
  const dur = 1000 + Math.min(400, Math.log10(Math.abs(target)+1)*120);
  const t0 = performance.now() + (delay||0);
  el.textContent = pre + fmt.format(0) + post;
  const step = now => {
    const p = Math.max(0, Math.min(1, (now - t0)/dur));
    const e = 1 - Math.pow(1 - p, 4);               // easeOutQuart
    el.textContent = pre + fmt.format(target * e) + post;
    if(p < 1) requestAnimationFrame(step);
    else el.textContent = pre + fmt.format(target) + post;
  };
  requestAnimationFrame(step);
}

const COUNT_SEL = '.hstat .v .num, .kpi .val .num, .oc-stat .v, .sg-tot b';

/* --------------------------------- الظهور المتدرّج --------------------------------- */
function motionPass(root){
  root = root || document.getElementById('content');
  if(!root) return;

  /* الكتل الرئيسية */
  Array.from(root.children).forEach((el,i)=>{
    if(el.classList.contains('rv')) return;
    el.classList.add('rv'); el.style.setProperty('--d', Math.min(i*60, 300)+'ms');
  });
  /* البطاقات داخل الشبكات — تدرّج قصير جداً حتى مع 34 مكتباً */
  root.querySelectorAll('.grid.g-kpi > .kpi, .office-grid > .office-card, .hero-stats > .hstat')
      .forEach((el,i)=>{ if(!el.classList.contains('rv')){ el.classList.add('rv');
        el.style.setProperty('--d', Math.min(i*22, 340)+'ms'); } });

  /* الإظهار الفوري: كل شيء يظهر الآن، بلا أي ارتباط بالتمرير */
  const show = () => {
    root.querySelectorAll('.rv').forEach(el=>el.classList.add('in'));
    root.querySelectorAll(COUNT_SEL).forEach((el,i)=>{
      const d = parseInt((el.closest('.rv')||el).style.getPropertyValue('--d')) || 0;
      countUp(el, MOTION_OK ? d : 0);
    });
    fillSparks(root);
  };
  if(MOTION_OK) requestAnimationFrame(()=>requestAnimationFrame(show));
  else show();
}

function fillSparks(root){
  root.querySelectorAll('.spark i[data-w]').forEach(el=>{
    const w = el.dataset.w;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.width = w; }));
  });
}

/* --------------------------------- حركة الرسوم --------------------------------- */
function animateCharts(root){
  if(!MOTION_OK) return;
  (root||document).querySelectorAll('.chart-svg').forEach(svg=>{
    if(svg.dataset.animated) return; svg.dataset.animated='1';
    svg.querySelectorAll('path[data-seg], rect[data-seg]').forEach((p,i)=>{
      p.classList.add('grow'); p.style.animationDelay = Math.min(i*32, 520)+'ms';
    });
    svg.querySelectorAll('path[data-segv]').forEach((p,i)=>{
      p.classList.add('growY'); p.style.animationDelay = Math.min(i*40, 560)+'ms';
    });
    svg.querySelectorAll('circle[data-mark]').forEach((c,i)=>{
      c.classList.add('pop'); c.style.animationDelay = Math.min(i*40, 600)+'ms';
    });
  });
}


/* ============================================================================
   رمز الريال السعودي — يستبدل نص «ر.س» بالرمز الرسمي (U+20C1) من خطٍّ مضمّن
   يتجاوز عناصر SVG والحقول والسكربتات، ولا يمسّ تصدير CSV.
   ============================================================================ */
const RS_CHAR = '⃁';
const RS_RE = /ر\.?\s?س\.?/g;
function riyalize(root){
  root = root || document.body;
  if(!/^ر\.?\s?س\.?$/.test(((typeof S!=='undefined' && S.meta && S.meta.currency) || 'ر.س').trim())) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode(n){
      if(!n.nodeValue || n.nodeValue.indexOf('ر.س') < 0) return NodeFilter.FILTER_REJECT;
      const p = n.parentElement;
      if(!p || p.closest('script,style,textarea,svg,.no-rs')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const nodes = []; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const parts = n.nodeValue.split(RS_RE);
    if(parts.length < 2) return;
    const frag = document.createDocumentFragment();
    parts.forEach((part,i)=>{
      if(i){ const sp = document.createElement('span'); sp.className='rs';
             sp.setAttribute('title','ريال سعودي'); sp.textContent = RS_CHAR; frag.appendChild(sp); }
      if(part) frag.appendChild(document.createTextNode(part));
    });
    n.parentNode.replaceChild(frag, n);
  });
}

/* الطباعة: إنهاء كل العدّادات فوراً وإظهار كل شيء قبل فتح نافذة الطباعة
   — حتى لا يُطبع رقم في منتصف حركة العدّ. */
function finalizeMotion(){
  try{ riyalize(document.body); }catch(e){}
  document.querySelectorAll('.rv').forEach(el=>el.classList.add('in'));
  document.querySelectorAll('[data-final]').forEach(el=>{ el.textContent = el.dataset.final; });
  document.querySelectorAll('[data-w]').forEach(el=>{ el.style.width = el.dataset.w; });
}
addEventListener('beforeprint', finalizeMotion);
