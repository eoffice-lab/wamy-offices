  --shadow:0 1px 2px rgba(51,72,153,.05), 0 8px 24px -12px rgba(51,72,153,.14);

  /* لوحة بيانات مُتحقَّق منها (عمى الألوان + التباين) */
  --series-1:#4A95D8;  /* النصف الأول */
  --series-2:#EB6834;  /* النصف الثاني */
  --series-3:#1BAF7A;  /* سلسلة ثالثة */

  --good:#0CA30C;
  --warning:#FAB219;
  --serious:#EC835A;
  --critical:#D03B3B;

  --seq-100:#DCEAF8; --seq-300:#8FC3EE; --seq-500:#4A95D8; --seq-700:#26356F;

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
  --sp:16px;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --navy:#141C3D;
  --navy-deep:#070C22;
  --navy-soft:#3A4A8F;
  --sky:#6FB1E8;
  --sky-tint:#1B2A55;

  --page:#0A1029;
  --surface-1:#141C3D;
  --surface-2:#1B2450;
  --text-primary:#FFFFFF;
  --text-secondary:#B9C6D8;
  --text-muted:#8496AC;
  --grid:#25305C;
  --axis:#39457C;
  --border:rgba(255,255,255,.11);
  --border-strong:rgba(255,255,255,.20);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);

  --series-1:#6FB1E8;
  --series-2:#DC6832;
  --series-3:#12A877;

  --seq-100:#22305E; --seq-300:#3E63A8; --seq-500:#6FB1E8; --seq-700:#A8CFF0;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  background:var(--page); color:var(--text-primary);
  font-size:14.5px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--sky);text-decoration:none}
table{border-collapse:collapse;width:100%}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;display:inline-block}

/* ---------- الهيكل ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.sidebar{
  background:var(--navy);color:#fff;padding:20px 16px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:22px;overflow-y:auto;
}
.brand{display:flex;flex-direction:column;align-items:stretch;gap:8px;
  background:#fff;margin:-20px -16px 0;padding:20px 18px 15px;border-bottom:1px solid rgba(51,72,153,.12)}
.brand-logo{display:flex;align-items:center;justify-content:flex-start}
.brand-logo img{width:100%;max-width:146px;height:auto;display:block}

.brand-name{font-weight:700;font-size:13px;letter-spacing:-.1px;line-height:1.45;color:#334899}
.brand-sub{font-size:10px;color:#5A6B80;line-height:1.5;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.45);letter-spacing:.6px;padding:0 10px 6px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);
  color:rgba(255,255,255,.80);font-weight:500;font-size:14px;transition:background .13s,color .13s;
}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:var(--sky);color:#fff;font-weight:600}
.nav a.active svg{opacity:1}
.nav svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.side-foot{margin-top:auto;font-size:11px;color:rgba(255,255,255,.45);border-top:1px solid rgba(255,255,255,.12);padding-top:14px}
.side-foot b{color:rgba(255,255,255,.75);font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  background:var(--surface-1);border-bottom:1px solid var(--border);
  padding:12px 26px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;
}
.topbar h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{padding:22px 26px 60px;max-width:1500px;width:100%}

/* ---------- عناصر ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-sm);
  border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);
  font-weight:500;font-size:13.5px;transition:background .13s,border-color .13s,transform .08s;
}
.btn:hover{background:var(--surface-2);border-color:var(--sky)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--sky);border-color:var(--sky);color:#fff}
.btn-primary:hover{background:#3B7FBE;border-color:#3B7FBE;color:#fff}
html[data-theme="dark"] .btn-primary:hover{background:#8FC3EE;border-color:#8FC3EE}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-soft);border-color:var(--navy-soft);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border)}
.btn-danger{color:var(--critical);border-color:var(--border-strong)}
.btn-danger:hover{background:rgba(208,59,59,.08);border-color:var(--critical)}
.btn-sm{padding:5px 10px;font-size:12.5px;gap:5px}
.btn-sm svg{width:13px;height:13px}
.btn-icon{padding:7px;border-radius:var(--r-sm)}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--text-secondary)}
.input,select.input,textarea.input{
  width:100%;padding:8px 11px;border:1px solid var(--border-strong);border-radius:var(--r-sm);
  background:var(--surface-1);color:var(--text-primary);transition:border-color .13s,box-shadow .13s;
}
.input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(74,149,216,.16)}
textarea.input{min-height:96px;resize:vertical;line-height:1.7}
.input[type=number]{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}

.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card-head{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-head h2{margin:0;font-size:15px;font-weight:600;flex:1}
.card-head .sub{font-size:12px;color:var(--text-muted);font-weight:400;display:block;margin-top:2px}

.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}

/* بطاقة مؤشر */
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-md);padding:15px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--sky)}
.kpi.k2::before{background:var(--series-2)}
.kpi.k3::before{background:var(--series-3)}
.kpi.k4::before{background:var(--navy-soft)}
.kpi .lab{font-size:12px;color:var(--text-secondary);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:4px;line-height:1.15}
.kpi .val small{font-size:13px;font-weight:600;color:var(--text-muted);letter-spacing:0}
.kpi .hint{font-size:11.5px;color:var(--text-muted);margin-top:2px}

/* شرائح ووسوم */
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-secondary)}
.tag svg{width:13px;height:13px;flex:0 0 13px}
.tag.ok{color:#0A7D0A;border-color:rgba(12,163,12,.35);background:rgba(12,163,12,.09)}
.tag.warn{color:#8A5D00;border-color:rgba(250,178,25,.4);background:rgba(250,178,25,.12)}
.tag.crit{color:#A82D2D;border-color:rgba(208,59,59,.35);background:rgba(208,59,59,.09)}
html[data-theme="dark"] .tag.ok{color:#5CD35C}
html[data-theme="dark"] .tag.warn{color:#F7C75A}
html[data-theme="dark"] .tag.crit{color:#F08080}
.dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px;display:inline-block}

/* جداول */
.tbl-wrap{overflow-x:auto}
table.tbl{font-size:13.5px}
table.tbl th{
  text-align:right;font-size:11.5px;font-weight:600;color:var(--text-muted);
  padding:9px 12px;border-bottom:1px solid var(--border-strong);white-space:nowrap;background:var(--surface-2);
}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl td.n,table.tbl th.n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
.row-actions{display:flex;gap:4px;justify-content:flex-start}
.empty{padding:34px 20px;text-align:center;color:var(--text-muted);font-size:13.5px}
.empty svg{width:34px;height:34px;opacity:.4;margin-bottom:8px}

/* بطاقات المكاتب */
.office-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,272px),1fr))}
.office-card{
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-md);padding:15px 16px;
  box-shadow:var(--shadow);cursor:pointer;transition:border-color .13s,transform .1s,box-shadow .13s;
  display:flex;flex-direction:column;gap:10px;text-align:right;
}
.office-card:hover{border-color:var(--sky);transform:translateY(-2px)}
.office-card .oc-top{display:flex;align-items:flex-start;gap:10px}
.oc-badge{
  width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:var(--sky-tint);color:var(--sky);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;
}
.oc-name{font-weight:600;font-size:14.5px;line-height:1.35}
.oc-loc{font-size:11.5px;color:var(--text-muted)}
.oc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--grid);padding-top:10px}
.oc-stat .k{font-size:10.5px;color:var(--text-muted)}
.oc-stat .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.mini-bar{height:5px;border-radius:3px;background:var(--grid);overflow:hidden;display:flex;gap:2px}
.mini-bar i{display:block;height:100%;border-radius:3px}

/* الرسوم */
.chart-box{position:relative}
.chart-svg{display:block;width:100%;overflow:visible;direction:ltr}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:2px 20px 14px;font-size:12px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{
  position:fixed;z-index:200;pointer-events:none;opacity:0;transform:translateY(3px);
  background:var(--navy-deep);color:#fff;border-radius:10px;padding:9px 12px;font-size:12.5px;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.5);max-width:270px;transition:opacity .1s;line-height:1.6;
  border:1px solid rgba(255,255,255,.12);
}
.tip.on{opacity:1;transform:translateY(0)}
.tip b{display:block;font-size:13px;margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:7px;justify-content:space-between}
.tip .r .v{font-variant-numeric:tabular-nums;direction:ltr;font-weight:600}
.axis-txt{font-size:11px;fill:var(--text-muted)}
.chart-svg text{unicode-bidi:plaintext}
.bar-lab{font-size:11.5px;fill:var(--text-secondary);font-weight:600;stroke:var(--surface-1);stroke-width:3px;paint-order:stroke fill;stroke-linejoin:round}
.view-toggle{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden}
.view-toggle button{padding:5px 11px;font-size:12px;font-weight:500;color:var(--text-secondary);background:var(--surface-1)}
.view-toggle button+button{border-inline-start:1px solid var(--border-strong)}
.view-toggle button.on{background:var(--sky);color:#fff;font-weight:600}

/* شرائح تنقّل داخلي */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs button{padding:9px 15px;font-size:13.5px;font-weight:500;color:var(--text-secondary);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--sky);border-bottom-color:var(--sky);font-weight:600}

/* نافذة منبثقة */
.modal-bg{position:fixed;inset:0;background:rgba(10,29,52,.55);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--surface-1);border-radius:var(--r-xl);box-shadow:0 30px 70px -20px rgba(0,0,0,.5);width:100%;max-width:540px;max-height:88vh;display:flex;flex-direction:column;border:1px solid var(--border)}
.modal.wide{max-width:760px}
.modal-head{padding:17px 21px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-head h3{margin:0;font-size:16px;font-weight:600;flex:1}
.modal-body{padding:20px 21px;overflow-y:auto}
.modal-foot{padding:14px 21px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-start;background:var(--surface-2);border-radius:0 0 var(--r-xl) var(--r-xl)}
.form-grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.form-grid .full{grid-column:1/-1}

/* تنبيه */
.banner{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-radius:var(--r-md);font-size:13px;margin-bottom:16px;border:1px solid}
.banner.warn{background:rgba(250,178,25,.10);border-color:rgba(250,178,25,.4);color:var(--text-primary)}
.banner.info{background:var(--sky-tint);border-color:rgba(74,149,216,.3)}
.banner svg{width:18px;height:18px;flex:0 0 18px;margin-top:2px}
.banner b{font-weight:600}

/* تقارير */
.rep-list{display:flex;flex-direction:column;gap:9px}
.rep{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2)}
.rep-ico{width:36px;height:36px;flex:0 0 36px;border-radius:9px;background:rgba(208,59,59,.10);color:var(--critical);display:flex;align-items:center;justify-content:center}
.rep-ico svg{width:19px;height:19px}
.rep-meta{flex:1;min-width:0}
.rep-meta .n{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep-meta .d{font-size:11.5px;color:var(--text-muted)}
.drop{
  border:2px dashed var(--border-strong);border-radius:var(--r-md);padding:26px 18px;text-align:center;
  color:var(--text-muted);font-size:13px;transition:border-color .13s,background .13s;cursor:pointer;
}
.drop:hover,.drop.over{border-color:var(--sky);background:var(--sky-tint);color:var(--sky)}
.drop svg{width:26px;height:26px;margin-bottom:6px;opacity:.6}

.search-wrap{position:relative;flex:0 1 280px}
.search-wrap svg{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-muted);pointer-events:none}
.search-wrap input{padding-inline-start:32px}

.toast{
  position:fixed;bottom:22px;inset-inline-start:22px;z-index:300;background:var(--navy-deep);color:#fff;
  padding:11px 17px;border-radius:var(--r-md);font-size:13.5px;box-shadow:0 14px 40px -10px rgba(0,0,0,.55);
  opacity:0;transform:translateY(10px);transition:opacity .18s,transform .18s;pointer-events:none;
  display:flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.14);
}
.toast.on{opacity:1;transform:translateY(0)}
.toast svg{width:16px;height:16px}

.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono-note{font-size:11.5px;color:var(--text-muted);line-height:1.7}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;align-items:center;gap:14px;overflow-x:auto;padding:12px 14px}
  .sidebar .nav-label,.side-foot{display:none}
  .brand{flex-direction:row;align-items:center;margin:0;padding:6px 10px;border-radius:9px;border-bottom:0;gap:9px}
  .brand-logo img{max-width:92px}
  .nav{flex-direction:row}
  .brand-sub{display:none}
  .content{padding:16px 14px 50px}
  .topbar{padding:11px 14px}
  .form-grid{grid-template-columns:1fr}
}
@media print{
  .sidebar,.topbar,.tabs,.no-print,.view-toggle{display:none !important}
  body{background:#fff}
  .app{grid-template-columns:1fr}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
  .content{padding:0;max-width:none}
}
@media (forced-colors:active){
  .kpi::before,.dot,.mini-bar i{forced-color-adjust:none}
}

/* ======================= تقرير الأداء (PDF) ======================= */
#reportRoot{display:none;position:fixed;inset:0;z-index:500;background:#E9EDF2;overflow:auto;padding:0 0 60px}
body.reporting{overflow:hidden}
body.reporting #reportRoot{display:block}
.rp-bar{
  position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:11px 20px;
  display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px -6px rgba(0,0,0,.4);
}
.rp-bar .t{font-weight:600;font-size:14.5px;flex:1}
.rp-bar .btn{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.28);color:#fff}
.rp-bar .btn:hover{background:rgba(255,255,255,.20);border-color:#fff}
.rp-bar .btn-primary{background:var(--sky);border-color:var(--sky)}
.rp-page{
  width:210mm;min-height:297mm;margin:22px auto;background:#fff;color:#0B1B30;
  padding:16mm 14mm 18mm;box-shadow:0 18px 50px -18px rgba(51,72,153,.4);
}
.rp-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #334899;padding-bottom:12px}
.rp-head .lg{width:124px;flex:0 0 124px;display:flex;align-items:center}
.rp-head .lg img{width:100%;height:auto;display:block}
.rp-head .org{font-size:16px;font-weight:700;color:#334899;line-height:1.35}
.rp-head .unit{font-size:11.5px;color:#4A5A70;margin-top:2px}
.rp-head .mt{margin-inline-start:auto;text-align:left;font-size:11px;color:#4A5A70;line-height:1.8;direction:rtl}
.rp-head .mt b{color:#334899}
.rp-title{font-size:21px;font-weight:700;color:#334899;margin:20px 0 2px;letter-spacing:-.3px}
.rp-title-sub{font-size:12.5px;color:#4A5A70;margin-bottom:18px}
.rp-h2{
  font-size:14.5px;font-weight:700;color:#334899;margin:22px 0 10px;padding-inline-start:10px;
  border-inline-start:4px solid #4A95D8;line-height:1.4;
}
.rp-p{font-size:12.8px;line-height:2;color:#243B57;margin:0 0 10px;text-align:justify}
.rp-p b{color:#334899}
.rp-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0 4px}
.rp-kpi{border:1px solid #DCE4EC;border-radius:9px;padding:10px 12px;background:#F7FAFC}
.rp-kpi .k{font-size:10.5px;color:#4A5A70}
.rp-kpi .v{font-size:18px;font-weight:700;color:#334899;font-variant-numeric:tabular-nums;direction:rtl;margin-top:1px}
.rp-kpi .v small{font-size:11px;font-weight:600;color:#78899E}
table.rp-tbl{width:100%;border-collapse:collapse;font-size:11.4px}
table.rp-tbl th{background:#334899;color:#fff;font-weight:600;padding:7px 8px;text-align:right;font-size:10.8px;white-space:nowrap}
table.rp-tbl td{padding:6px 8px;border-bottom:1px solid #E4EAF1}
table.rp-tbl td:nth-child(2){min-width:94px}
table.rp-tbl tbody tr:nth-child(even){background:#F7FAFC}
table.rp-tbl td.n,table.rp-tbl th.n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
table.rp-tbl tfoot td{background:#EAF3FB;font-weight:700;border-top:2px solid #334899;padding:7px 8px}
.rp-flags{display:flex;flex-direction:column;gap:7px;font-size:12.2px}
.rp-flag{display:flex;gap:9px;align-items:flex-start;border:1px solid #DCE4EC;border-radius:9px;padding:9px 11px;background:#F7FAFC;line-height:1.7}
.rp-flag i{width:8px;height:8px;border-radius:3px;flex:0 0 8px;margin-top:7px}
.rp-note{font-size:11px;color:#78899E;line-height:1.8;margin-top:8px}
.rp-foot{margin-top:26px;padding-top:10px;border-top:1px solid #DCE4EC;display:flex;gap:10px;font-size:10.5px;color:#78899E}
.rp-sign{display:grid;gap:22px;margin-top:34px}
.rp-sign.c2{grid-template-columns:1fr 1fr}
.rp-sign.c3{grid-template-columns:repeat(3,1fr)}
.rp-sign .box{text-align:center}
.rp-sign .t{display:block;font-size:11px;color:#4A5A70;line-height:1.5}
.rp-sign .n{display:block;font-size:13.5px;font-weight:700;color:#334899;margin-top:3px}
.rp-sign .line{margin-top:34px;border-top:1px solid #B8C4D2;padding-top:6px;font-size:10.5px;color:#78899E}
.rp-break{break-before:page;page-break-before:always}
.rp-avoid{break-inside:avoid;page-break-inside:avoid}

/* ============ تقرير أداء المكتب — تصميم مستقل ============ */
.rp-page.ro{padding:0 0 14mm}
.ro-head{display:flex;align-items:center;gap:15px;padding:13mm 14mm 11px}
.ro-logo{width:118px;height:auto;display:block}
.ro-org b{display:block;font-size:14.5px;color:#334899;font-weight:700;line-height:1.35}
.ro-org span{display:block;font-size:10.5px;color:#4A5A70;margin-top:2px}
.ro-badge{margin-inline-start:auto;background:#334899;color:#fff;font-size:10.5px;font-weight:600;
  padding:6px 14px;border-radius:999px;white-space:nowrap}
.ro-rule{height:4px;margin:0 14mm;border-radius:2px;background:linear-gradient(90deg,#4A95D8 0%,#334899 100%)}
.ro-hero{display:flex;gap:16px;align-items:flex-end;margin:15px 14mm 0;padding:15px 18px;border-radius:14px;
  background:linear-gradient(120deg,#F3F9FD 0%,#E6F1FA 100%);border-inline-start:5px solid #4A95D8}
.ro-kicker{font-size:10.5px;color:#4A95D8;font-weight:700}
.ro-hero h1{margin:4px 0 3px;font-size:23px;color:#334899;letter-spacing:-.4px;line-height:1.25}
.ro-meta{font-size:12px;color:#4A5A70}
.ro-hero-side{margin-inline-start:auto;display:flex;gap:20px;text-align:center}
.ro-hero-side div{font-size:10px;color:#4A5A70;white-space:nowrap}
.ro-hero-side b{display:block;font-size:12.5px;color:#334899;margin-top:3px}
.ro-body{padding:0 14mm}
.ro-h2{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;color:#334899;margin:24px 0 10px}
.ro-h2 i{width:24px;height:24px;flex:0 0 24px;border-radius:8px;background:#334899;color:#fff;font-style:normal;
  display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700}
.ro-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0 4px}
.ro-kpi{border:1px solid #DCE4EC;border-radius:11px;padding:11px 13px;background:#fff;position:relative;overflow:hidden}
.ro-kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:#4A95D8}
.ro-kpi.n2::before{background:#EB6834}
.ro-kpi.n3::before{background:#1BAF7A}
.ro-kpi .k{font-size:10.5px;color:#4A5A70}
.ro-kpi .v{font-size:18.5px;font-weight:700;color:#334899;margin-top:1px;font-variant-numeric:tabular-nums;direction:rtl}
.ro-kpi .v small{font-size:11px;color:#78899E;font-weight:600}
.ro-foot{margin:26px 14mm 0;padding-top:10px;border-top:1px solid #DCE4EC;display:flex;align-items:center;gap:11px;
  font-size:10.5px;color:#78899E}
.ro-foot img{width:50px;height:auto;opacity:.9;flex:0 0 50px}
.ro-foot span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rp-page.ro table.rp-tbl tfoot{display:table-row-group}   /* صف الإجمالي مرة واحدة في النهاية */
@media print{
  body.reporting .app{display:none !important}
  body.reporting #reportRoot{display:block;position:static;background:#fff;padding:0;overflow:visible}
  body.reporting{overflow:visible}
  .rp-bar{display:none !important}
  .rp-page{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
  table.rp-tbl thead{display:table-header-group}
  .rp-kpis{grid-template-columns:repeat(3,1fr)}
  @page{size:A4;margin:14mm 12mm}
}
@media screen and (max-width:860px){ .rp-page{width:auto;margin:12px;padding:16px} .rp-kpis{grid-template-columns:1fr 1fr} }

/* ===== نسخة الويب: عرض فقط (البيانات مصدرها Google Sheets) ===== */
html.ro #addOffice, html.ro #bulkName, html.ro #bulkName2, html.ro #editOffice,
html.ro #addEmp, html.ro #bulkEmp, html.ro #addRep, html.ro #repDrop,
html.ro [data-emp-edit], html.ro [data-emp-del],
html.ro #expData, html.ro #expFull, html.ro #impData, html.ro #saveMeta,
html.ro #pickLogo, html.ro #rmLogo, html.ro #applyCount, html.ro #resetAll,
html.ro #exportBtn, html.ro .drop { display:none !important }
html.ro [data-bud], html.ro #bH1, html.ro #bH2 {
  pointer-events:none; background:var(--surface-2); border-color:transparent; color:var(--text-primary);
}
html.ro .field input, html.ro .field select, html.ro .field textarea { pointer-events:none; background:var(--surface-2) }
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);white-space:nowrap}
.sync .st{width:8px;height:8px;border-radius:50%;background:var(--good);flex:0 0 8px}
.sync .st.load{background:var(--warning);animation:pulse 1s infinite}
.sync .st.err{background:var(--critical)}
@keyframes pulse{50%{opacity:.35}}
.src-card{display:flex;flex-direction:column;gap:10px}
.src-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2)}
.src-row b{font-weight:600}
.src-row .ok{color:#0A7D0A}.src-row .bad{color:var(--critical)}
html[data-theme="dark"] .src-row .ok{color:#5CD35C}

/* ======================= خريطة المكاتب الدولية ======================= */
.map-card{overflow:hidden}
.map-wrap{position:relative;padding:6px 10px 12px;
  background:linear-gradient(170deg,#EEF5FA 0%,#DCEAF4 55%,#CFE2EF 100%)}
html[data-theme="dark"] .map-wrap{background:linear-gradient(170deg,#0F2440 0%,#0A1A2E 60%,#081524 100%)}
#worldMap{width:100%;height:auto;display:block;max-height:min(64vh,600px)}
#worldMap .land{fill:#A7B6D4;transition:fill .12s}
html[data-theme="dark"] #worldMap .land{fill:#2A3766}
#worldMap .land.o{fill:var(--navy);cursor:pointer;stroke:rgba(255,255,255,.55);stroke-width:1.1;
  paint-order:stroke fill}
html[data-theme="dark"] #worldMap .land.o{fill:#6FB1E8;stroke:rgba(255,255,255,.35)}
#worldMap .land.o:hover,#worldMap .land.o.hot{fill:var(--sky)}
html[data-theme="dark"] #worldMap .land.o:hover,html[data-theme="dark"] #worldMap .land.o.hot{fill:#A8CFF0}
#worldMap .pin{fill:var(--sky);stroke:#fff;stroke-width:2;cursor:pointer;transition:r .1s}
#worldMap .pin:hover,#worldMap .pin.hot{fill:var(--navy)}
html[data-theme="dark"] #worldMap .pin{fill:#A8CFF0;stroke:#0A1029}
#worldMap .hit{fill:transparent;cursor:pointer}
.map-legend{display:flex;align-items:center;gap:14px;font-size:12px;color:var(--text-secondary);flex-wrap:wrap}
.map-legend span{display:inline-flex;align-items:center;gap:6px}
.map-legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.map-legend i.lg-off{background:var(--navy)}
.map-legend i.lg-other{background:#A7B6D4}
html[data-theme="dark"] .map-legend i.lg-off{background:#6FB1E8}
html[data-theme="dark"] .map-legend i.lg-other{background:#2A3766}
.map-note{padding:0 20px 14px;font-size:11.5px;color:var(--text-muted)}
@media (max-width:700px){ #worldMap{max-height:none} }

/* ============================================================================
   طبقة التصميم v2 — تحسين المظهر فقط (لا تمسّ التقارير rp-* / ro-*)
   ============================================================================ */
:root{
  --r-sm:10px; --r-md:14px; --r-lg:18px; --r-xl:24px;
  --shadow:0 1px 2px rgba(51,72,153,.045), 0 6px 18px -12px rgba(51,72,153,.18);
  --shadow-lg:0 2px 6px rgba(51,72,153,.06), 0 22px 46px -24px rgba(51,72,153,.30);
  --ring:0 0 0 3px rgba(74,149,216,.20);
}
html[data-theme="dark"]{
  --shadow:0 1px 2px rgba(0,0,0,.35), 0 8px 22px -14px rgba(0,0,0,.7);
  --shadow-lg:0 3px 8px rgba(0,0,0,.4), 0 26px 54px -26px rgba(0,0,0,.85);
  --ring:0 0 0 3px rgba(111,177,232,.26);
}
body{ font-feature-settings:"ss01";
  background:
    radial-gradient(1100px 520px at 100% -8%, rgba(74,149,216,.10), transparent 62%),
    radial-gradient(900px 460px at -10% 108%, rgba(51,72,153,.07), transparent 60%),
    var(--page);
  background-attachment:fixed;
}
html[data-theme="dark"] body{
  background:
    radial-gradient(1100px 520px at 100% -8%, rgba(111,177,232,.10), transparent 62%),
    radial-gradient(900px 460px at -10% 108%, rgba(111,177,232,.05), transparent 60%),
    var(--page);
}
::selection{background:rgba(74,149,216,.22)}
.app{grid-template-columns:270px 1fr}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:rgba(51,72,153,.18);border-radius:99px;border:3px solid transparent;background-clip:content-box}
html[data-theme="dark"] *::-webkit-scrollbar-thumb{background:rgba(255,255,255,.16);background-clip:content-box}

/* ---------------- الشريط الجانبي ---------------- */
.sidebar{
  background:linear-gradient(178deg,#3A4FA3 0%,#2C3C82 46%,#1E2C63 100%);
  border-inline-start:0; box-shadow:inset -1px 0 0 rgba(255,255,255,.05);
}
.brand{box-shadow:0 8px 20px -14px rgba(0,0,0,.5)}
.nav-label{font-size:9.5px;letter-spacing:1.4px;color:rgba(255,255,255,.38);padding:0 12px 7px;text-transform:none}
.nav a{
  position:relative;border-radius:11px;padding:10px 12px;font-size:14px;font-weight:500;
  color:rgba(255,255,255,.74);transition:background .16s,color .16s,transform .12s;
}
.nav a::before{
  content:"";position:absolute;inset-inline-start:-14px;top:50%;transform:translateY(-50%);
  width:3px;height:0;border-radius:0 3px 3px 0;background:var(--sky);transition:height .18s;
}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a.active{
  background:linear-gradient(90deg, rgba(74,149,216,.32), rgba(74,149,216,.16));
  color:#fff;font-weight:600;box-shadow:inset 0 0 0 1px rgba(255,255,255,.10);
}
.nav a.active::before{height:22px}
.nav svg{opacity:.72}
.nav a.active svg,.nav a:hover svg{opacity:1}
.side-foot{font-size:10.5px;color:rgba(255,255,255,.42);border-top:1px solid rgba(255,255,255,.09);padding-top:13px}

/* ---------------- الشريط العلوي ---------------- */
.topbar{
  background:color-mix(in srgb, var(--surface-1) 82%, transparent);
  backdrop-filter:saturate(150%) blur(12px);
  border-bottom:1px solid var(--border);padding:11px 30px;gap:10px;
}
.topbar h1{font-size:16.5px;font-weight:600;letter-spacing:-.2px}
@media (min-width:901px){ .topbar h1{display:none} .topbar::before{content:"";flex:1} }
.content{padding:26px 30px 70px}

/* ترويسة الصفحة */
.page-head{margin:0 0 22px}
.ph-kicker{font-size:10.5px;font-weight:700;color:var(--sky);letter-spacing:.5px}
.ph-title{margin:5px 0 3px;font-size:25px;font-weight:700;letter-spacing:-.6px;line-height:1.25}
.ph-sub{font-size:13px;color:var(--text-muted)}

/* ---------------- البطاقات ---------------- */
.card{border-radius:var(--r-lg);box-shadow:var(--shadow);border-color:var(--border);
  transition:box-shadow .2s,transform .2s}
.card-head{padding:17px 22px;gap:14px;align-items:center}
.card-head h2{font-size:15px;font-weight:600;letter-spacing:-.2px}
.card-head .sub{font-size:12px;margin-top:3px;color:var(--text-muted);font-weight:400}
.card-pad{padding:20px 22px}

/* ---------------- بطاقات المؤشرات ---------------- */
.grid.g-kpi{gap:14px;grid-template-columns:repeat(auto-fit,minmax(212px,1fr))}
.kpi{
  border-radius:var(--r-md);padding:17px 19px 16px;box-shadow:var(--shadow);
  background:linear-gradient(180deg, var(--surface-1), color-mix(in srgb, var(--surface-1) 92%, var(--sky-tint)));
  transition:transform .18s, box-shadow .18s;
}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.kpi{overflow:hidden}
.kpi::before{inset-inline:0;top:0;bottom:auto;width:auto;height:4px;border-radius:0;
  background:linear-gradient(90deg,var(--sky),color-mix(in srgb,var(--sky) 45%, var(--navy)))}
.kpi.k2::before{background:linear-gradient(90deg,var(--series-2),#F2A47D)}
.kpi.k3::before{background:linear-gradient(90deg,var(--series-3),#6FD9B4)}
.kpi.k4::before{background:linear-gradient(90deg,var(--navy-soft),var(--navy))}
.kpi .lab{font-size:11.5px;font-weight:600;color:var(--text-muted);letter-spacing:.1px}
.kpi .val{font-size:29px;font-weight:700;letter-spacing:-1px;margin-top:6px}
.kpi .val small{font-size:12.5px;font-weight:600}
.kpi .hint{font-size:11.5px;margin-top:4px}

/* ---------------- الأزرار ---------------- */
.btn{border-radius:11px;padding:9px 15px;font-size:13.5px;font-weight:500;
  transition:background .15s,border-color .15s,box-shadow .15s,transform .1s}
.btn:focus-visible{outline:none;box-shadow:var(--ring)}
.btn-primary{box-shadow:0 1px 2px rgba(74,149,216,.3), 0 8px 18px -10px rgba(74,149,216,.55)}
.btn-navy{box-shadow:0 1px 2px rgba(51,72,153,.3), 0 8px 18px -10px rgba(51,72,153,.5)}
.btn-sm{padding:6px 11px;border-radius:9px}
.btn-icon{padding:8px;border-radius:10px}
.view-toggle{border-radius:10px;overflow:hidden}
.view-toggle button{padding:6px 12px}

/* ---------------- الحقول ---------------- */
.input,select.input,textarea.input{border-radius:11px;padding:9px 12px}
.search-wrap input{border-radius:999px;padding-inline-start:34px}

/* ---------------- الجداول ---------------- */
table.tbl th{
  font-size:10.5px;letter-spacing:.6px;font-weight:700;color:var(--text-muted);
  padding:11px 14px;background:color-mix(in srgb, var(--surface-2) 70%, transparent);
  border-bottom:1px solid var(--border);
}
table.tbl td{padding:11px 14px;border-bottom:1px solid var(--grid)}
table.tbl tbody tr{transition:background .12s}
table.tbl tbody tr:hover{background:color-mix(in srgb, var(--sky-tint) 60%, transparent)}
table.tbl tfoot td{background:color-mix(in srgb, var(--sky-tint) 45%, transparent)}

/* ---------------- الوسوم ---------------- */
.tag{padding:3px 10px;border-radius:999px;font-size:11.5px;font-weight:600}
.dot{border-radius:4px}

/* ---------------- بطاقات المكاتب ---------------- */
.office-grid{gap:15px;grid-template-columns:repeat(auto-fill,minmax(min(100%,288px),1fr))}
.office-card{
  border-radius:var(--r-lg);padding:17px 18px;gap:12px;box-shadow:var(--shadow);
  background:linear-gradient(180deg,var(--surface-1),color-mix(in srgb,var(--surface-1) 94%, var(--sky-tint)));
  transition:transform .18s, box-shadow .18s, border-color .18s;
}
.office-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--sky) 55%, transparent)}
.oc-badge{
  width:42px;height:42px;flex:0 0 42px;border-radius:13px;font-size:14px;line-height:1;font-weight:700;
  background:color-mix(in srgb, var(--sky-tint) 85%, transparent);
  box-shadow:inset 0 0 0 1px var(--border);
}
.oc-name{font-size:15px;font-weight:650;letter-spacing:-.2px}
.oc-loc{font-size:11.5px;margin-top:1px}
.mini-bar{height:6px;border-radius:99px}
.mini-bar i{border-radius:99px}
.oc-stats{gap:10px;padding-top:12px}
.oc-stat .k{font-size:10px;letter-spacing:.2px;font-weight:600;color:var(--text-muted)}
.oc-stat .v{font-size:15px;font-weight:700;letter-spacing:-.3px}

/* ---------------- الخريطة ---------------- */
.map-card{border-radius:var(--r-lg)}
.map-wrap{margin:0 14px 14px;border-radius:var(--r-md);padding:8px 12px;position:relative;
  box-shadow:inset 0 0 0 1px var(--border), inset 0 12px 30px -22px rgba(51,72,153,.5)}
.map-legend{background:var(--surface-1);border:1px solid var(--border);border-radius:999px;
  padding:6px 13px;box-shadow:var(--shadow)}
.map-note{padding:0 22px 16px}

/* ---------------- التبويبات والنوافذ ---------------- */
.tabs button{padding:10px 16px;font-size:13.5px}
.modal{border-radius:var(--r-xl);box-shadow:var(--shadow-lg)}
.banner{border-radius:var(--r-md);padding:13px 16px}
.toast{border-radius:13px}
.tip{border-radius:12px;padding:10px 13px;box-shadow:0 12px 34px -10px rgba(0,0,0,.55)}
.rep{border-radius:var(--r-md);padding:12px 14px;background:color-mix(in srgb,var(--surface-2) 75%, transparent)}
.rep-ico{border-radius:11px}
.empty{padding:40px 20px}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .content{padding:16px 14px 56px}
  .ph-title{font-size:21px}
  .topbar{padding:10px 14px}
  .map-wrap{margin:0 8px 10px}
}

/* ---------------- صفحة الموظفين: تجميع حسب المكتب ---------------- */
.sg-code{
  width:36px;height:36px;flex:0 0 36px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--sky-tint);color:var(--sky);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;
  box-shadow:inset 0 0 0 1px var(--border);
}
.sg-tot{text-align:center;font-size:11px;color:var(--text-muted);white-space:nowrap}
.sg-tot b{display:block;font-size:14px;color:var(--text-primary);font-variant-numeric:tabular-nums;margin-top:2px}
.print-head{display:none;align-items:center;gap:14px;padding-bottom:10px;margin-bottom:16px;border-bottom:2px solid var(--navy)}
.print-head img{width:104px;height:auto}
.print-head .ph-txt b{display:block;font-size:14px;color:var(--navy)}
.print-head .ph-txt span{display:block;font-size:10.5px;color:var(--text-secondary);margin-top:2px}
.print-head .ph-meta{margin-inline-start:auto;text-align:left;font-size:11px;color:var(--text-secondary);line-height:1.7}
@media print{
  .print-head{display:flex !important}
  /* جدول الميزانيات: مضغوط ليستوعب كل المكاتب */
  .budget-card{box-shadow:none;border-color:#ccc;break-inside:auto !important;page-break-inside:auto !important}
  .budget-card .tbl-wrap{overflow:visible}
  .budget-card table.tbl thead{display:table-header-group}
  .budget-card .card-head{padding:3px 10px}
  .print-head{padding-bottom:5px;margin-bottom:7px}
  .print-head img{width:88px}
  .budget-card .card-head h2{font-size:12px}
  .budget-card .card-head .sub{display:none}
  .budget-card table.tbl th{padding:3px 5px;font-size:8.2px;letter-spacing:0}
  .budget-card table.tbl td{padding:0.8px 5px;font-size:8.4px;white-space:nowrap;line-height:1.45}
  .budget-card table.tbl tbody tr:hover{background:transparent}
  .budget-card table.tbl td .input{padding:0 !important;border:0 !important;background:transparent !important;font-size:9.5px}
  .budget-card table.tbl tfoot td{font-size:9px;padding:2px 5px}
  /* المكاتب: ثلاث بطاقات في السطر ومضغوطة */
  .office-grid{grid-template-columns:repeat(3,1fr) !important;gap:7px !important}
  .office-card{box-shadow:none;border-color:#ccc;padding:8px 10px;gap:6px;break-inside:avoid;background:#fff !important}
  .office-card .oc-badge{width:26px;height:26px;flex:0 0 26px;border-radius:8px;font-size:10.5px}
  .office-card .oc-name{font-size:11px}
  .office-card .oc-loc{font-size:9px}
  .office-card .oc-stat .k{font-size:8px}
  .office-card .oc-stat .v{font-size:10.5px}
  .office-card .mini-bar{height:4px}
  .office-card .tag{font-size:8.5px;padding:1px 6px}
  .page-head,.grid.g-kpi{display:none !important}
  .staff-group{break-inside:avoid;page-break-inside:avoid;box-shadow:none;border-color:#ccc;margin-bottom:10px !important}
  .staff-group .card-head{padding:8px 10px}
  .staff-group table.tbl th{padding:6px 8px;font-size:9.5px}
  .staff-group table.tbl td{padding:5px 8px;font-size:10.5px}
  @page{size:A4 portrait;margin:9mm 8mm}
}

.oc-meta{display:flex;gap:6px;flex-wrap:wrap}

/* ============================================================================
   طبقة التصميم v3 — هوية «وامي» الرسمية + منظومة حركة
   الكحلي البنفسجي #334899 · السماوي #4A95D8 (مأخوذان من ملف الشعار الأصلي)
   الخط: IBM Plex Sans Arabic — مضمّن داخل الملف (يعمل بلا إنترنت)
   لا تمسّ هذه الطبقة أنماط التقارير rp-* / ro-*
   ============================================================================ */

/* ------------------------------ متغيّرات مضافة ------------------------------ */
:root{
  --brand:#334899;
  --brand-2:#4A95D8;
  --ink:#0E1733;
  --ease:cubic-bezier(.22,1,.36,1);
  --ease-soft:cubic-bezier(.4,0,.2,1);
  --glass:rgba(255,255,255,.72);
  --hero-1:#2B3D85;
  --hero-2:#334899;
  --hero-3:#4A95D8;
}
html[data-theme="dark"]{
  --glass:rgba(20,28,61,.72);
  --hero-1:#1A2350;
  --hero-2:#28356F;
  --hero-3:#33529A;
}

body{ font-family:"IBM Plex Sans Arabic","IBM Plex Sans Arabic Fallback",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
      font-size:14.6px; letter-spacing:-.1px }

/* ------------------------------ خلفية حيّة ------------------------------ */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora i{position:absolute;display:block;border-radius:50%;filter:blur(70px);opacity:.42}
.aurora i:nth-child(1){width:46vw;height:46vw;top:-16vw;inset-inline-end:-10vw;
  background:radial-gradient(circle,rgba(74,149,216,.55),transparent 68%);animation:floatA 26s var(--ease-soft) infinite alternate}
.aurora i:nth-child(2){width:38vw;height:38vw;bottom:-14vw;inset-inline-start:-8vw;
  background:radial-gradient(circle,rgba(51,72,153,.42),transparent 68%);animation:floatB 32s var(--ease-soft) infinite alternate}
.aurora i:nth-child(3){width:26vw;height:26vw;top:38%;inset-inline-start:32%;
  background:radial-gradient(circle,rgba(111,177,232,.28),transparent 70%);animation:floatC 38s var(--ease-soft) infinite alternate;opacity:.3}
html[data-theme="dark"] .aurora i{opacity:.3}
@keyframes floatA{to{transform:translate3d(-6vw,7vh,0) scale(1.12)}}
@keyframes floatB{to{transform:translate3d(5vw,-6vh,0) scale(1.16)}}
@keyframes floatC{to{transform:translate3d(-4vw,-5vh,0) scale(1.2)}}

/* ------------------------------ ظهور تدريجي ------------------------------ */
.rv{opacity:0;transform:translateY(14px);filter:blur(2px)}
.rv.in{opacity:1;transform:none;filter:none;
  transition:opacity .62s var(--ease) var(--d,0ms),transform .62s var(--ease) var(--d,0ms),filter .62s var(--ease) var(--d,0ms)}

/* ------------------------------ الشريط الجانبي ------------------------------ */
.sidebar{
  background:
    radial-gradient(120% 60% at 100% 0%, rgba(74,149,216,.30), transparent 60%),
    linear-gradient(178deg,#3A4FA3 0%,#2C3C82 42%,#1E2C63 100%);
  box-shadow:inset -1px 0 0 rgba(255,255,255,.07), 6px 0 34px -26px rgba(30,44,99,.9);
}
html[data-theme="dark"] .sidebar{
  background:radial-gradient(120% 60% at 100% 0%, rgba(74,149,216,.20), transparent 62%),
    linear-gradient(178deg,#1B2550 0%,#131C3D 52%,#0C132B 100%);
}
/* كتلة الشعار: امتداد بصري للشريط العلوي — اللون نفسه تماماً بلا شفافية
   (الشفافية كانت تُظهر تدرّج الخلفية خلف الشريط الجانبي بلون بنفسجي غير مرغوب) */
.brand{
  background:var(--surface-1);
  border-radius:0;
  border-bottom:1px solid var(--border);
  box-shadow:none;
}
.brand-name{color:var(--text-primary)}
.brand-sub{color:var(--text-muted)}
/* الوضع الليلي: الشعار بالنسخة الأحادية البيضاء مع توهّج خفيف — أوضح تباينٍ ممكن */
html[data-theme="dark"] .brand{
  background:var(--surface-1);
  border-bottom-color:rgba(255,255,255,.13);
}
html[data-theme="dark"] .brand-logo{
  position:relative;
}
html[data-theme="dark"] .brand-logo::before{
  content:"";position:absolute;inset:-26px -22px;
  background:radial-gradient(58% 70% at 62% 50%, rgba(111,177,232,.16), transparent 72%);
  pointer-events:none;
}
html[data-theme="dark"] .brand-logo img{
  filter:brightness(0) invert(1) drop-shadow(0 2px 10px rgba(111,177,232,.45));
  opacity:.97;
}
.brand-logo img{transition:transform .5s var(--ease)}
.brand:hover .brand-logo img{transform:scale(1.03)}
.nav a{border-radius:12px}
.nav a.active{
  background:linear-gradient(90deg, rgba(74,149,216,.42), rgba(74,149,216,.14));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.14), 0 10px 22px -16px rgba(0,0,0,.9);
}
.nav a.active::before{background:#8FC3EE;box-shadow:0 0 12px rgba(143,195,238,.9)}
.nav a:hover{transform:translateX(-2px)}
html[dir="rtl"] .nav a:hover{transform:translateX(-2px)}

/* ------------------------------ الشريط العلوي ------------------------------ */
/* الشريط العلوي وكتلة الشعار بلون واحد تماماً فيبدوان شريطاً واحداً متصلاً */
.topbar{
  background:var(--surface-1);
  backdrop-filter:none;
  box-shadow:0 1px 0 var(--border), 0 14px 30px -30px rgba(30,44,99,.55);
}
.sync{background:color-mix(in srgb,var(--surface-2) 70%, transparent);border:1px solid var(--border);
  border-radius:999px;padding:5px 11px}
.sync .st{box-shadow:0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent)}
.sync .st.load{box-shadow:0 0 0 3px rgba(250,178,25,.22)}
.sync .st.err{box-shadow:0 0 0 3px rgba(208,59,59,.22)}

/* ------------------------------ ترويسة الصفحة ------------------------------ */
.page-head{position:relative;padding-inline-start:16px;margin-bottom:24px}
.page-head::before{content:"";position:absolute;inset-inline-start:0;top:6px;bottom:6px;width:4px;border-radius:99px;
  background:linear-gradient(180deg,var(--brand-2),var(--brand))}
.ph-kicker{color:var(--brand-2);letter-spacing:.8px;font-size:10.5px}
.ph-title{font-size:27px;letter-spacing:-.9px}

/* ------------------------------ اللوحة البطولية ------------------------------ */
.hero{
  position:relative;overflow:hidden;border-radius:26px;margin-bottom:20px;color:#fff;
  background:linear-gradient(122deg,var(--hero-1) 0%,var(--hero-2) 46%,var(--hero-3) 100%);
  box-shadow:0 30px 60px -34px rgba(30,44,99,.75), inset 0 0 0 1px rgba(255,255,255,.10);
  isolation:isolate;
}
.hero::before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(60% 90% at 92% 0%, rgba(143,195,238,.42), transparent 62%),
    radial-gradient(45% 80% at 4% 100%, rgba(255,255,255,.14), transparent 60%);
}
.hero::after{
  content:"";position:absolute;inset:-40% -10%;z-index:-1;opacity:.30;
  background:conic-gradient(from 0deg, transparent 0deg, rgba(255,255,255,.16) 90deg, transparent 200deg);
  animation:heroSpin 22s linear infinite;
}
@keyframes heroSpin{to{transform:rotate(360deg)}}
.hero-grid{position:absolute;inset:0;z-index:-1;opacity:.18;
  background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px);
  background-size:46px 46px;
  mask-image:radial-gradient(70% 100% at 80% 0%, #000, transparent 72%);
  -webkit-mask-image:radial-gradient(70% 100% at 80% 0%, #000, transparent 72%);
}
.hero-in{padding:30px 32px 26px;display:flex;flex-wrap:wrap;gap:26px;align-items:flex-end}
.hero-copy{flex:1 1 320px;min-width:0}
.hero-kicker{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;letter-spacing:.6px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);padding:5px 12px;border-radius:999px}
.hero-kicker i{width:7px;height:7px;border-radius:50%;background:#8FE3B0;box-shadow:0 0 0 3px rgba(143,227,176,.28);
  animation:blip 2.4s ease-in-out infinite}
@keyframes blip{50%{opacity:.35;box-shadow:0 0 0 6px rgba(143,227,176,0)}}
.hero h2{margin:13px 0 6px;font-size:31px;font-weight:700;letter-spacing:-1.1px;line-height:1.25}
.hero p{margin:0;font-size:13.5px;line-height:1.9;color:rgba(255,255,255,.82);max-width:52ch}
.hero-stats{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:14px;flex:1 1 560px;min-width:0}
.hstat{
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.18);border-radius:18px;padding:14px 16px;
  backdrop-filter:blur(6px);transition:transform .25s var(--ease),background .25s;position:relative;overflow:hidden;
}
.hstat:hover{transform:translateY(-3px);background:rgba(255,255,255,.16)}
.hstat .k{font-size:11px;color:rgba(255,255,255,.78);font-weight:500;display:flex;align-items:center;gap:6px}
.hstat .k svg{width:14px;height:14px;opacity:.9}
.hstat .v{font-size:clamp(19px,1.95vw,28px);font-weight:700;letter-spacing:-1px;margin-top:5px;line-height:1.15;
  font-variant-numeric:tabular-nums;direction:ltr;text-align:right;white-space:nowrap}
.hstat .v small{font-size:12px;font-weight:600;color:rgba(255,255,255,.72);letter-spacing:0}
.hstat .s{font-size:11px;color:rgba(255,255,255,.68);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hstat .spark{margin-top:9px;height:5px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden;display:flex}
.hstat .spark i{display:block;height:100%;border-radius:99px;background:#8FC3EE;width:0;transition:width 1.1s var(--ease) .35s}
.hstat .spark i.b{background:rgba(255,255,255,.45)}
@media (max-width:820px){
  .hero-in{padding:22px 20px}
  .hero h2{font-size:24px}
  .hero-stats{grid-template-columns:1fr 1fr;flex-basis:340px}
}
@media (max-width:520px){ .hero-stats{grid-template-columns:1fr} }

/* ------------------------------ بطاقات المؤشرات ------------------------------ */
.kpi{
  border-radius:20px;padding:18px 20px 17px;position:relative;
  background:linear-gradient(180deg,var(--surface-1),color-mix(in srgb,var(--surface-1) 90%,var(--sky-tint)));
}
.kpi::after{
  content:"";position:absolute;inset-inline-end:-30px;top:-40px;width:130px;height:130px;border-radius:50%;
  background:radial-gradient(circle,color-mix(in srgb,var(--sky) 18%,transparent),transparent 70%);
  opacity:0;transition:opacity .35s var(--ease);pointer-events:none;
}
.kpi:hover::after{opacity:1}
.kpi:hover{transform:translateY(-3px)}
.kpi .val{font-size:30px;letter-spacing:-1.2px}

/* ------------------------------ البطاقات ------------------------------ */
.card{border-radius:22px;backdrop-filter:blur(2px)}
.card:hover{box-shadow:var(--shadow-lg)}
.card-head h2{letter-spacing:-.3px}
.card-head::before{content:none}

/* ------------------------------ بطاقات المكاتب ------------------------------ */
.office-card{border-radius:20px;position:relative;overflow:hidden}
.office-card::before{
  content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;
  background:linear-gradient(180deg,var(--brand-2),var(--brand));transform:scaleY(0);transform-origin:top;
  transition:transform .3s var(--ease);
}
.office-card:hover::before{transform:scaleY(1)}
.oc-badge{background:linear-gradient(150deg,color-mix(in srgb,var(--sky-tint) 92%,transparent),color-mix(in srgb,var(--sky) 16%,transparent));
  color:var(--brand);transition:transform .3s var(--ease)}
.office-card:hover .oc-badge{transform:rotate(-4deg) scale(1.06)}
.oc-stat .v{transition:color .2s}
.office-card:hover .oc-stat .v{color:var(--brand)}
.oc-mail{font-size:11px;color:var(--text-muted);direction:ltr;text-align:right;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ------------------------------ الجداول ------------------------------ */
table.tbl tbody tr{animation:rowIn .45s var(--ease) both}
table.tbl th{position:sticky;top:0;z-index:1;backdrop-filter:blur(6px)}
@keyframes rowIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ------------------------------ الرسوم البيانية ------------------------------ */
.chart-svg .grow{transform:scaleX(0);transform-origin:right center;transform-box:fill-box;
  animation:growX .9s var(--ease) forwards}
@keyframes growX{to{transform:scaleX(1)}}
.chart-svg .pop{opacity:0;animation:popIn .5s var(--ease) forwards}
@keyframes popIn{from{opacity:0;transform:scale(.4);transform-box:fill-box;transform-origin:center}
  to{opacity:1;transform:scale(1)}}
.chart-svg .growY{transform:scaleY(0);transform-origin:bottom center;transform-box:fill-box;
  animation:growY .8s var(--ease) forwards}
@keyframes growY{to{transform:scaleY(1)}}

/* ------------------------------ الخريطة ------------------------------ */
.map-wrap{background:linear-gradient(170deg,#EEF4FC 0%,#DFEAF7 55%,#D2E1F2 100%)}
html[data-theme="dark"] .map-wrap{background:linear-gradient(170deg,#141E45 0%,#0D142F 60%,#0A1026 100%)}
#worldMap .land{fill:#A7B6D4}
html[data-theme="dark"] #worldMap .land{fill:#2A3766}
#worldMap .land.o{fill:var(--brand)}
html[data-theme="dark"] #worldMap .land.o{fill:#5E8FD6}
#worldMap .land.o:hover,#worldMap .land.o.hot{fill:var(--brand-2)}
#worldMap .pin{fill:var(--brand-2);stroke:#fff;stroke-width:2;
  animation:pinDrop .6s var(--ease) both}
@keyframes pinDrop{from{opacity:0;transform:translateY(-14px) scale(.4);transform-box:fill-box;transform-origin:center}
  to{opacity:1;transform:none}}
#worldMap .halo{fill:var(--brand-2);opacity:.30;transform-box:fill-box;transform-origin:center;
  animation:halo 2.8s ease-out infinite}
@keyframes halo{0%{transform:scale(.6);opacity:.42}70%{transform:scale(2.6);opacity:0}100%{opacity:0}}
.map-legend{background:color-mix(in srgb,var(--surface-1) 88%,transparent);backdrop-filter:blur(8px)}
.map-legend i.lg-off{background:var(--brand)}
.map-legend i.lg-other{background:#A7B6D4}

/* ------------------------------ الوسوم والأزرار ------------------------------ */
.tag{backdrop-filter:blur(4px)}
.btn-primary{background:linear-gradient(135deg,var(--brand-2),#3B7FBE);border-color:transparent}
.btn-primary:hover{background:linear-gradient(135deg,#3B7FBE,#2F6EA8)}
.btn-navy{background:linear-gradient(135deg,#3A4FA3,var(--brand));border-color:transparent}
.btn-navy:hover{background:linear-gradient(135deg,var(--brand),#26356F)}
.btn{position:relative;overflow:hidden}
.btn::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),
  rgba(255,255,255,.35),transparent 55%);opacity:0;transition:opacity .3s}
.btn:hover::after{opacity:.5}

/* ------------------------------ شريط التقدّم العلوي ------------------------------ */
.loadbar{position:fixed;top:0;inset-inline:0;height:3px;z-index:400;background:transparent;pointer-events:none}
.loadbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand-2),#8FC3EE);
  box-shadow:0 0 12px rgba(74,149,216,.8);transition:width .4s var(--ease),opacity .5s}

/* ------------------------------ شارة الإصدار ------------------------------ */
.build-chip{display:inline-flex;align-items:center;gap:6px;font-size:10px;padding:3px 9px;border-radius:999px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);color:rgba(255,255,255,.72)}

/* ------------------------------ تفاصيل المكتب ------------------------------ */
.od-hero{
  position:relative;overflow:hidden;border-radius:24px;padding:22px 24px;margin-bottom:18px;color:#fff;
  background:linear-gradient(120deg,#2B3D85,#334899 52%,#4A95D8);
  box-shadow:0 26px 54px -32px rgba(30,44,99,.8), inset 0 0 0 1px rgba(255,255,255,.10);
}
.od-hero::after{content:"";position:absolute;inset:-50% -20%;opacity:.22;
  background:conic-gradient(from 210deg, transparent, rgba(255,255,255,.20) 100deg, transparent 220deg);
  animation:heroSpin 26s linear infinite}

/* ------------------------------ احترام تفضيل تقليل الحركة ------------------------------ */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;
    transition-duration:.001ms !important}
  .rv{opacity:1;transform:none;filter:none}
  .aurora{display:none}
}
/* ------------------------------ الطباعة ------------------------------ */
@media print{
  /* كشف الموظفين: ضغط الصفحات — مجموعات تنساب عبر الصفحات بلا فراغ */
  .staff-group{break-inside:auto !important;page-break-inside:auto !important;
    margin-bottom:5px !important;border-radius:0;box-shadow:none;border-color:#ccc}
  .staff-group .card-head{padding:4px 8px;break-after:avoid;page-break-after:avoid}
  .staff-group .card-head h2{font-size:10.5px}
  .staff-group .card-head .sub{font-size:8.5px;margin-top:0}
  .staff-group .sg-code{width:20px;height:20px;flex:0 0 20px;border-radius:6px;font-size:9px}
  .staff-group .sg-tot{font-size:7.5px}
  .staff-group .sg-tot b{font-size:9px;margin-top:0}
  .staff-group table.tbl thead{display:table-header-group}
  .staff-group table.tbl th{padding:2.5px 6px !important;font-size:8px !important;letter-spacing:0}
  .staff-group table.tbl td{padding:1.5px 6px !important;font-size:9px !important;line-height:1.4;
    white-space:nowrap}
  .staff-group table.tbl tr{break-inside:avoid;page-page-break-inside:avoid}
  .staff-group table.tbl tbody tr{animation:none !important}
  .staff-group table.tbl tbody tr:hover{background:transparent}
  /* جدول الميزانيات: إخفاء عمود «الرواتب/سنة» عند الطباعة */
  .budget-card table.tbl th:nth-child(7),
  .budget-card table.tbl td:nth-child(7){display:none !important}
  .aurora,.hero::after,.od-hero::after,.loadbar{display:none !important}
  .hero,.od-hero{color:#000;background:#fff !important;box-shadow:none;border:1px solid #ccc}
  .rv{opacity:1 !important;transform:none !important;filter:none !important}
}

/* ------------------------------ رمز الريال السعودي ------------------------------ */
/* الخط الرسمي مفتوح المصدر للرمز (SIL OFL 1.1) — مضمّن، ويرث اللون والحجم والوزن */
.rs{
  font-family:"SaudiRiyal";font-style:normal;line-height:1;
  display:inline-block;font-size:1.14em;transform:translateY(.05em);
  font-feature-settings:normal;letter-spacing:0;
}
.num .rs{transform:translateY(.02em)}
@media print{ .rs{transform:translateY(.04em)} }

</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="loadbar" aria-hidden="true"><i></i></div>
<div class="app">
  <!-- ============ الشريط الجانبي ============ -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo"></div>
      <div style="min-width:0">
        <div class="brand-name" id="brandName">الندوة العالمية للشباب الإسلامي</div>
        <div class="brand-sub" id="brandUnit">إدارة المكاتب والعلاقات الدولية — قسم المكاتب الدولية</div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-label">التنقّل</div>
      <a href="#" data-nav="dash" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        لوحة المؤشرات
      </a>
      <a href="#" data-nav="offices">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18M5 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M15 21V9h3a2 2 0 0 1 2 2v10"/><path d="M9 7h2M9 11h2M9 15h2"/></svg>
        المكاتب
      </a>
      <a href="#" data-nav="staff">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13A4 4 0 0 1 16 11"/></svg>
        الموظفون
      </a>
      <a href="#" data-nav="hr">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V8l6-4 6 4v13"/><path d="M15 21V11l6 4v6"/><path d="M7 12h2M7 16h2"/></svg>
        الموارد البشرية
      </a>
      <a href="#" data-nav="budget">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
        الميزانيات
      </a>
      <div class="nav-label" style="padding-top:12px">الإدارة</div>
      <a href="#" data-nav="settings">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6h.09A1.65 1.65 0 0 0 10 3.09V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v.09a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        مصدر البيانات والإعدادات
      </a>
    </nav>

    <div class="side-foot">
      <div>آخر تحديث: <b id="lastSaved">—</b></div>
      <div style="margin-top:4px">إشراف: <b>فيصل الحيد</b></div>
      <div style="margin-top:7px"><span class="build-chip">إصدار <b id="buildTag">—</b></span></div>
    </div>
  </aside>

  <!-- ============ المحتوى ============ -->
  <div class="main">
    <header class="topbar">
      <h1 id="pageTitle">لوحة المؤشرات</h1>
      <div class="search-wrap no-print" id="globalSearchWrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input class="input" id="globalSearch" type="search" placeholder="ابحث عن مكتب أو موظف…">
      </div>
      <button class="btn btn-icon no-print" id="themeBtn" title="تبديل الوضع الليلي" aria-label="تبديل الوضع الليلي">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4"/></svg>
      </button>
      <span class="tag no-print" id="roTag" title="البيانات تُعدَّل من ملف Google Sheets فقط" style="gap:5px">عرض فقط</span>
      <div class="sync no-print" id="syncBox" title="مصدر البيانات: Google Sheets">
        <span class="st" id="syncDot"></span><span id="syncTxt">—</span>
      </div>
      <button class="btn btn-icon no-print" id="refreshBtn" title="تحديث البيانات الآن" aria-label="تحديث البيانات">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>

const FileStore = {
  db:null, ok:false, mem:new Map(),
  async init(){
    try{
      this.db = await new Promise((res,rej)=>{
        const r = indexedDB.open('wamy-offices-files', 1);
        r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files'); };
        r.onsuccess = ()=>res(r.result);
        r.onerror = ()=>rej(r.error);
        setTimeout(()=>rej(new Error('timeout')), 4000);
      });
      this.ok = true;
    }catch(e){ this.ok = false; }
    return this.ok;
  },
  _tx(mode){ return this.db.transaction('files', mode).objectStore('files'); },
  async put(id, blob){
    if(!this.ok){ this.mem.set(id, blob); return; }
    return new Promise((res,rej)=>{ const r=this._tx('readwrite').put(blob,id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
  },
  async get(id){
    if(!this.ok) return this.mem.get(id) || null;
    return new Promise(res=>{ const r=this._tx('readonly').get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); });
  },
  async del(id){
    if(!this.ok){ this.mem.delete(id); return; }
    return new Promise(res=>{ const r=this._tx('readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>res(); });
  }
};

/* ---------------------------------------------------------- محلل CSV ---- */
function csvParse(txt){
  const rows=[]; let row=[], f='', q=false;
  txt = String(txt).replace(/^﻿/,'');
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){
      if(c==='"'){ if(txt[i+1]==='"'){ f+='"'; i++; } else q=false; }
      else f+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c==='\r'){ /* تجاهل */ }
    else f+=c;
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
const cell = (r,i)=> (r && r[i]!=null) ? String(r[i]).trim() : '';
const AR_DIGITS = { '٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9',
                    '۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9' };
const toNum = v => {
  let t = String(v==null?'':v)
    .replace(/[٠-٩۰-۹]/g, d => AR_DIGITS[d])
    .replace(/٫/g, '.')
    .replace(/[،٬]/g, ',')
    .replace(/[  \s]/g,'')
    .replace(/[^\d.,\-]/g,'');
  const neg = /^-/.test(t); t = t.replace(/-/g,'');
  const nC = (t.match(/,/g)||[]).length, nD = (t.match(/\./g)||[]).length;
  if(nC && nD){                                            // الاثنان: الأخير هو العشري
    if(t.lastIndexOf(',') > t.lastIndexOf('.')) t = t.replace(/\./g,'').replace(/,/g,'.');  // 2.250.000,50
    else t = t.replace(/,/g,'');                                                            // 1,473,000.50
  }
  else if(nC){
    const seg = t.split(',');
    t = (seg[seg.length-1].length === 2 && seg.length >= 2)
        ? seg.slice(0,-1).join('') + '.' + seg[seg.length-1]   // 450,50 هللات
        : seg.join('');                                       // 1,250,000 آلاف
  }
  else if(nD > 1){ t = t.replace(/\./g,''); }             // 1.473.000 نقاط آلاف
  else if(nD === 1){
    const after = t.split('.')[1] || '';
    if(after.length === 3) t = t.replace('.','');         // 37.500 فاصل آلاف
  }
  const n = Number(t.replace(/[^\d.]/g,''));
  return isFinite(n) ? (neg ? -n : n) : 0;
};

  .replace(/\s+/g,' ').trim();

function parseStaffFlat(txt){
  const t = parseTable(txt); if(!t.body) return [];
  /* 0 المكتب | 1 الرقم الوظيفي | 2 اسم الموظف | 3 المسمى | 4 نوع التعاقد | 5 الراتب الشهري */
  const at = (re, pos) => { const i = t.idx(re); return i >= 0 ? i : pos; };
  const iOff=at(/المكتب/,0), iId=at(/الرقم\s*الوظيفي/,1), iName=at(/اسم\s*الموظف|^الاسم/,2),
        iTitle=at(/المسمى/,3), iType=at(/التعاقد/,4), iSal=at(/الراتب/,5);
  const map = new Map();
  t.body.forEach(r=>{
    const off = cell(r, iOff<0?0:iOff), nm = cell(r, iName<0?2:iName);
    if(!off || !nm) return;
    const key = normCountry(off);
    if(!map.has(key)) map.set(key, { name: off.replace(/^مكتب\s+/,'').trim(), employees:[] });
    map.get(key).employees.push({ id:uid('e'), empId: iId>=0?cell(r,iId):'', name:nm,
      title: iTitle>=0?cell(r,iTitle):'', type: (iType>=0?cell(r,iType):'')||'دوام كلي',
      dept:'', salary: iSal>=0?toNum(cell(r,iSal)):0 });
  });
  return [...map.values()];
}

function parseStaff(txt){
  const rows = csvParse(txt), out = [];
  let cur = null, salIdx = -1;
  rows.forEach(r=>{
    const a=cell(r,0), b=cell(r,1), c=cell(r,2);
    if(/اسم\s*الموظف/.test(c) || /الرقم\s*الوظيفي/.test(b)){          // صف العناوين
      r.forEach((v,i)=>{ if(/الراتب/.test(String(v))) salIdx=i; });
      return;
    }
    if(a && !b && !c){ cur = { name:a, employees:[] }; out.push(cur); return; }  // صف اسم الدولة
    if(!cur || !c) return;
    let sal = salIdx>=0 ? toNum(cell(r,salIdx)) : 0;
    if(!sal) for(let i=r.length-1;i>=5;i--){ const v=toNum(cell(r,i)); if(v){ sal=v; break; } }
    cur.employees.push({ id:uid('e'), empId:b, name:c, title:cell(r,3), type:cell(r,4)||'دوام كلي', dept:'', salary:sal });
  });
  return out;
}

function mergeThousands(row){
  const out = [];
  for(let i=0;i<row.length;i++){
    let v = String(row[i]).trim();
    if(/^-?\d{1,3}$/.test(v)){
      while(i+1 < row.length && /^\d{3}(\.\d+)?$/.test(String(row[i+1]).trim())){
        v += String(row[i+1]).trim(); i++;
      }
      if(i+1 < row.length && /^\d{2}$/.test(String(row[i+1]).trim())){   // هللات
        v += '.' + String(row[i+1]).trim(); i++;
      }
    }
    out.push(v);
  }
  return out;
}
function parseTable(txt){
  const rows = csvParse(txt).filter(r=>r.some(v=>String(v).trim()!==''));
  if(!rows.length) return [];
  const head = rows[0].map(h=>String(h).trim());
  const idx = re => head.findIndex(h=>re.test(h));
  const body = rows.slice(1).map(r => r.length > head.length ? mergeThousands(r) : r);
  return { head, idx, body };
}
/* اسم لا يُقبل إن كان رقماً أو مبلغاً — حارس ضد انزياح الأعمدة */
const notNumeric = v => {
  const x = String(v==null?'':v).trim();
  return (!x || /^[\d.,\s\u0660-\u0669\u066B\u066C%+-]+$/.test(x)) ? '' : x;
};

function budgetRows(txt){
  if(!looksBudgets(txt)) return [];
  const t = parseTable(txt); if(!t.body) return [];
  /* Google يُفرِّغ عنوان الأعمدة الرقمية عند التصدير، فنعتمد ترتيب القالب عند غياب العنوان:
     0 المكتب | 1 الدولة | 2 المدينة | 3 مدير المكتب | 4 النصف الأول | 5 النصف الثاني */
  const at = (re, pos) => { const i = t.idx(re); return i >= 0 ? i : pos; };
  const iName=at(/المكتب/,0), iC=at(/^الدولة/,1), iCity=at(/المدينة/,2),
        iH1=at(/الأول/,4), iH2=at(/الثاني/,5);
  /* عمود «مدير المكتب» بلا موضع احتياطي: إن لم يوجد العنوان فلا يُقرأ أصلاً،
     لئلا يُلتقط عمود مبلغٍ مكانه. */
  const iMgr = t.idx(/مدير/);
  return t.body.map(r=>{
    let h1 = iH1>=0?toNum(cell(r,iH1)):0, h2 = iH2>=0?toNum(cell(r,iH2)):0;
    if(!h1 && !h2){                                   // احتياط: أعمدة منزاحة
      const nums = r.map(v=>toNum(v)).filter(v=>v>0);
      if(nums.length >= 2){ h1 = nums[nums.length-2]; h2 = nums[nums.length-1]; }
      else if(nums.length === 1){ h1 = nums[0]; }
    }
    return { name: cell(r, iName<0?0:iName),
      country: iC>=0?cell(r,iC):'', city: iCity>=0?cell(r,iCity):'',
      manager: iMgr>=0 ? notNumeric(cell(r,iMgr)) : '',
      h1, h2 };
  }).filter(x=>x.name);
}
/* تبويب «الميزانيات» هو مرجع أسماء المكاتب وترتيبها، وتُلحق به كتل الموظفين من «الورقة1» */
/* معرّف ثابت مشتق من اسم الدولة: يبقى كما هو بعد كل مزامنة، فلا تنكسر صفحة المكتب
   ولا روابط الخريطة عند التحديث التلقائي كل عشر دقائق. */
const stableId = s => 'of_' + normCountry(s).replace(/\s+/g,'_');

function buildRoster(blocks, budTxt){
  const pool = blocks.map(b=>({ ...b, key:normCountry(b.name), used:false }));
  const out = [];
  const rows = budTxt ? budgetRows(budTxt) : [];
  rows.forEach(r=>{
    const key = normCountry(r.country || r.name);
    const b = pool.find(x=>!x.used && x.key===key);
    if(b) b.used = true;
    const emps = b ? b.employees : [];
    /* المدير من تبويب «الموظفون» أولاً لأنه المصدر المحدَّث.
       وعمود «مدير المكتب» في تبويب الميزانيات لا يُستخدم إلا إذا كان الاسم
       موجوداً فعلاً بين موظفي المكتب (أو كان المكتب بلا موظفين) — لئلا يبقى
       اسم موظف انتقل من المكتب ظاهراً كمدير. */
    let mgr = (emps.find(e=>/مدير\s*مكتب/.test(e.title||''))||{}).name || '';
    if(!mgr && notNumeric(r.manager)){
      const known = emps.some(e => normCountry(e.name) === normCountry(r.manager));
      mgr = (known || !emps.length) ? r.manager : '';
    }
    out.push(Object.assign(blankOffice(out.length+1), {
      id: stableId(r.country || r.name),
      name: r.name.trim(), country: r.country || (b?b.name:''), city: r.city,
      manager: mgr, h1: r.h1, h2: r.h2, employees: emps, reports: []
    }));
  });
  pool.filter(x=>!x.used).forEach(b=>{
    const mgr = (b.employees.find(e=>/مدير\s*مكتب/.test(e.title||''))||{}).name || '';
    out.push(Object.assign(blankOffice(out.length+1), {
      id: stableId(b.name),
      name:'مكتب '+b.name, country:b.name, manager:mgr, employees:b.employees, reports:[] }));
  });
  return out;
}
function applyBudgets(offices, txt){
  const t = parseTable(txt); if(!t.body) return 0;
  const iName=t.idx(/المكتب|الدولة\s*$/), iCountry=t.idx(/^الدولة/), iCity=t.idx(/المدينة/),
        iMgr=t.idx(/مدير/), iH1=t.idx(/الأول/), iH2=t.idx(/الثاني/);
  let n=0;
  t.body.forEach(r=>{
    const key = normName(cell(r, iName<0?0:iName)); if(!key) return;
    const o = offices.find(x=>normName(x.name)===key || normName(x.country)===key);
    if(!o) return;
    if(iH1>=0) o.h1 = toNum(cell(r,iH1));
    if(iH2>=0) o.h2 = toNum(cell(r,iH2));
    if(iCity>=0 && cell(r,iCity)) o.city = cell(r,iCity);
    if(iCountry>=0 && cell(r,iCountry)) o.country = cell(r,iCountry);
    if(iMgr>=0 && cell(r,iMgr)) o.manager = cell(r,iMgr);
    n++;
  });
  return n;
}
/* ------------------------------------------------------------ المزامنة -- */
const RAW = { staff:'', budgets:'', offices:'' };
let SYNC = { at:null, ok:false, msg:'لم تُضبط روابط الشيت بعد', counts:{} };
function paintSync(state, text){
  try{ if(state==='load') LoadBar.start(); else LoadBar.done(); }catch(e){}
  const d=$('#syncDot'), t=$('#syncTxt'); if(!d) return;
  d.className = 'st' + (state==='load'?' load':state==='err'?' err':'');
  t.textContent = text;
}
/* تحقّق من هوية الجدول المقروء — gviz يعيد الورقة الأولى إذا لم يجد اسم التبويب */
const headOf = txt => (csvParse(txt)[0] || []).map(x=>String(x));
function looksBudgets(txt){ const h=headOf(txt).join(' | ');
  return /المكتب/.test(h) && /(النصف|الأول|الثاني)/.test(h); }
function looksOffices(txt){ const h=headOf(txt).join(' | ');
  return /المكتب/.test(h) && /المقر/.test(h) && /التصريح/.test(h); }
/* تبويب «المكاتب»: المكتب | الدولة | نوع المقر | نوع التصريح */
function applyOfficeMeta(offices, txt){
  if(!looksOffices(txt)) return 0;
  const t = parseTable(txt); if(!t.body) return 0;
  const at = (re,pos)=>{ const i=t.idx(re); return i>=0?i:pos; };
  const iName=at(/المكتب/,0), iC=at(/^الدولة/,1), iVen=at(/المقر/,2), iPer=at(/التصريح/,3);
  const iMail = t.idx(/بريد|إيميل|mail/i);
  let n=0;
  t.body.forEach(r=>{
    const key = normCountry(cell(r,iC) || cell(r,iName)); if(!key) return;
    const o = offices.find(x=>normCountry(x.country)===key || normCountry(x.name)===key);
    if(!o) return;
    o.venue  = cell(r,iVen);
    o.permit = cell(r,iPer);
    if(iMail >= 0){ const m = cell(r,iMail); if(m) o.email = m; }
    n++;
  });
  return n;
}
function looksStaffFlat(txt){ const h=headOf(txt).join(' | ');
  return /المكتب/.test(h) && /(اسم\s*الموظف|الاسم)/.test(h) && !/النصف/.test(h); }

async function grabAny(list, force, validate){
  const errs = [];
  for(const src of list){
    if(!src || !src.url) continue;
    try{
      const txt = await grab(src.url, force);
      if(!txt || txt.trim().length < 20){ errs.push(src.via+': فارغ'); continue; }
      if(validate && !validate(txt)){ errs.push(src.via+': جدول غير مطابق'); continue; }
      return { txt, via:src.via, url:src.url };
    }catch(e){ errs.push(src.via+': '+(e.message||e)); }
  }
  throw new Error(errs.join(' | ') || 'لا مصدر متاح');
}
async function grab(url, force){
  if(/^\d+$/.test(String(url).trim())) url = SHEET_BASE + String(url).trim();   // gid فقط
  const stamp = force ? Date.now() : Math.floor(Date.now()/30000);
  /* Google يتجاهل المعاملات المجهولة ويعيد نسخة مخزّنة، لكنه يحترم reqId داخل tqx */
  if(url.indexOf('tqx=out:csv') > -1) url = url.replace('tqx=out:csv', 'tqx=out:csv;reqId:' + stamp);
  const u = url + (url.includes('?')?'&':'?') + 'cachebust=' + stamp;
  const res = await fetch(u, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.text();
}
async function syncFromSheet(showToast){
  if(!SHEET_ID && !SHEET_URLS.staff){ paintSync('err','بيانات مدمجة'); return false; }
  paintSync('load','جارٍ التحديث…');
  try{
    const via = {};
    /* 1) الموظفون — تبويب «الموظفون» المسطّح هو المصدر الوحيد.
       «الورقة1» القديمة لم تُعد تُقرأ لأنها لا تُحدَّث فكانت تُظهر أسماء قديمة. */
    let blocks = [], staffErr = '';
    try{
      const g = await grabAny([
        { url: gvizUrl(SHEET_TABS.staff),    via:'gviz/الموظفون' },
        { url: gvizUrl('الموظفين'),          via:'gviz/الموظفين' },
        { url: gvizUrl('الموظفون '),         via:'gviz/الموظفون(مسافة)' },
        { url: SHEET_URLS.staff,             via:'رابط منشور' }
      ], showToast, looksStaffFlat);
      RAW.staff = 'المصدر: ' + g.url.slice(0,150) + '\nعدد الصفوف: ' + (csvParse(g.txt).length-1) + '\n' + g.txt.split('\n').slice(0,3).join('\n');
      blocks = parseStaffFlat(g.txt);
      via.staff = g.via;
    }catch(e){ staffErr = String(e.message||e); }

    /* 2) الميزانيات — بالـgid أولاً */
    let budTxt = null;
    try{ const g = await grabAny([
        { url: gvizGid(SHEET_GIDS.budgets), via:'gviz#gid الميزانيات' },
        { url: gvizUrl(SHEET_TABS.budgets), via:'gviz/الميزانيات' },
        { url: SHEET_URLS.budgets,          via:'رابط منشور' }], showToast, looksBudgets);
      budTxt = g.txt; via.budgets = g.via; RAW.budgets = g.txt.split('\n').slice(0,4).join('\n');
    }catch(e){ via.budgets = 'تعذّر: '+String(e.message||e).slice(0,80); }

    /* 3) تبويب «المكاتب» — نوع المقر ونوع التصريح */
    let offTxt = null;
    try{ const g = await grabAny([
        { url: gvizGid(SHEET_GIDS.offices), via:'gviz#gid المكاتب' },
        { url: gvizUrl(SHEET_TABS.offices), via:'gviz/المكاتب' },
        { url: SHEET_URLS.offices,          via:'رابط منشور' }], showToast, looksOffices);
      offTxt = g.txt; via.offices = g.via; RAW.offices = g.txt.split('\n').slice(0,3).join('\n');
    }catch(e){ via.offices = 'تعذّر'; }

    if(!blocks.length && !budTxt) throw new Error(staffErr || 'تعذّر الوصول إلى الشيت');

    const offices = buildRoster(blocks, budTxt);
    if(!offices.length) throw new Error('الشيت مقروء لكن بلا صفوف');
    const counts = { offices:offices.length, staff:offices.reduce((s,o)=>s+o.employees.length,0),
                     budgets: budTxt ? budgetRows(budTxt).length : 0, offices2:0, via };
    if(offTxt) counts.offices2 = applyOfficeMeta(offices, offTxt);

    S.offices = offices;
    SYNC = { at:new Date(), ok:true, counts,
      msg: counts.staff ? '' : 'تعذّرت قراءة تبويب «الموظفون». تأكد من وجوده بهذا الاسم وبأعمدته: المكتب | الرقم الوظيفي | اسم الموظف | المسمى الوظيفي | نوع التعاقد | الراتب الشهري. («الورقة1» القديمة لا تُقرأ إطلاقاً.)' };
    paintSync('ok','آخر تحديث '+SYNC.at.toLocaleTimeString('ar-EG-u-nu-latn',{hour:'2-digit',minute:'2-digit'}));
    render(); paintSaveState();
    if(showToast) toast('حُدّثت البيانات: '+counts.offices+' مكتب و '+counts.staff+' موظف');
    return true;
  }catch(e){
    SYNC = { at:SYNC.at, ok:false, msg:String(e.message||e), counts:SYNC.counts };
    paintSync('err','تعذّر التحديث');
    if(showToast) toast('تعذّر قراءة الشيت — يُعرض آخر نسخة محفوظة','warn');
    return false;
  }
}

/* ------------------------------------------------------------ حسابات */
const CUR = () => S.meta.currency || 'ر.س';
const money = v => num(v) + ' ' + CUR();
const annualFactor = () => S.meta.salaryPeriod === 'monthly' ? 12 : 1;
const payrollBase = o => (o.employees||[]).reduce((s,e)=>s+(Number(e.salary)||0),0);
const payrollAnnual = o => payrollBase(o) * annualFactor();
const officeTotal = o => (Number(o.h1)||0) + (Number(o.h2)||0);
const getOffice = id => S.offices.find(o=>o.id===id);
const allEmployees = () => S.offices.flatMap(o=>(o.employees||[]).map(e=>({...e, _office:o})));
const officeLabel = o => (o.name && o.name.trim()) ? o.name : ('مكتب '+o.code);

function totals(){
  const t = { h1:0, h2:0, total:0, payroll:0, staff:0, filled:0 };
  S.offices.forEach(o=>{
    t.h1 += Number(o.h1)||0; t.h2 += Number(o.h2)||0;
    t.payroll += payrollAnnual(o);
    t.staff += (o.employees||[]).length;
    if(officeTotal(o)>0 || (o.employees||[]).length) t.filled++;
  });
  t.total = t.h1 + t.h2;
  return t;
}
