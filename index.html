  --border:rgba(15,42,74,.10);
  --border-strong:rgba(15,42,74,.18);
  --shadow:0 1px 2px rgba(15,42,74,.05), 0 8px 24px -12px rgba(15,42,74,.14);

  /* لوحة بيانات مُتحقَّق منها (عمى الألوان + التباين) */
  --series-1:#1E88C7;  /* النصف الأول */
  --series-2:#EB6834;  /* النصف الثاني */
  --series-3:#1BAF7A;  /* سلسلة ثالثة */

  --good:#0CA30C;
  --warning:#FAB219;
  --serious:#EC835A;
  --critical:#D03B3B;

  --seq-100:#CDE6F7; --seq-300:#7FC0E5; --seq-500:#1E88C7; --seq-700:#0F4E77;

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px;
  --sp:16px;
}
html[data-theme="dark"]{
  color-scheme: dark;
  --navy:#0F1F38;
  --navy-deep:#081426;
  --navy-soft:#25456F;
  --sky:#3FA9E0;
  --sky-tint:#14304F;

  --page:#0A1729;
  --surface-1:#0F1F38;
  --surface-2:#132845;
  --text-primary:#FFFFFF;
  --text-secondary:#B9C6D8;
  --text-muted:#8496AC;
  --grid:#1E3454;
  --axis:#2C4870;
  --border:rgba(255,255,255,.11);
  --border-strong:rgba(255,255,255,.20);
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);

  --series-1:#2E9BD4;
  --series-2:#DC6832;
  --series-3:#12A877;

  --seq-100:#1B3C5C; --seq-300:#2A6E9E; --seq-500:#2E9BD4; --seq-700:#7FC5E8;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font-family:"IBM Plex Sans Arabic", system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
  background:var(--page); color:var(--text-primary);
  font-size:14.5px; line-height:1.65; -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:var(--sky);text-decoration:none}
table{border-collapse:collapse;width:100%}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:embed;display:inline-block}

/* ---------- الهيكل ---------- */
.app{display:grid;grid-template-columns:252px 1fr;min-height:100vh}
.sidebar{
  background:var(--navy);color:#fff;padding:20px 16px;position:sticky;top:0;height:100vh;
  display:flex;flex-direction:column;gap:22px;overflow-y:auto;
}
.brand{display:flex;flex-direction:column;align-items:stretch;gap:8px;
  background:#fff;margin:-20px -16px 0;padding:20px 18px 15px;border-bottom:1px solid rgba(15,42,74,.12)}
.brand-logo{display:flex;align-items:center;justify-content:flex-start}
.brand-logo img{width:100%;max-width:146px;height:auto;display:block}

.brand-name{font-weight:700;font-size:13px;letter-spacing:-.1px;line-height:1.45;color:#0F2A4A}
.brand-sub{font-size:10px;color:#5A6B80;line-height:1.5;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-label{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.45);letter-spacing:.6px;padding:0 10px 6px}
.nav a{
  display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:var(--r-sm);
  color:rgba(255,255,255,.80);font-weight:500;font-size:14px;transition:background .13s,color .13s;
}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.active{background:var(--sky);color:#fff;font-weight:600}
.nav a.active svg{opacity:1}
.nav svg{width:17px;height:17px;flex:0 0 17px;opacity:.85}
.side-foot{margin-top:auto;font-size:11px;color:rgba(255,255,255,.45);border-top:1px solid rgba(255,255,255,.12);padding-top:14px}
.side-foot b{color:rgba(255,255,255,.75);font-weight:600}

.main{min-width:0;display:flex;flex-direction:column}
.topbar{
  background:var(--surface-1);border-bottom:1px solid var(--border);
  padding:12px 26px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:40;
}
.topbar h1{font-size:17px;font-weight:600;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.content{padding:22px 26px 60px;max-width:1500px;width:100%}

/* ---------- عناصر ---------- */
.btn{
  display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:var(--r-sm);
  border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-primary);
  font-weight:500;font-size:13.5px;transition:background .13s,border-color .13s,transform .08s;
}
.btn:hover{background:var(--surface-2);border-color:var(--sky)}
.btn:active{transform:translateY(1px)}
.btn svg{width:15px;height:15px}
.btn-primary{background:var(--sky);border-color:var(--sky);color:#fff}
.btn-primary:hover{background:#1874AC;border-color:#1874AC;color:#fff}
html[data-theme="dark"] .btn-primary:hover{background:#59B7E6;border-color:#59B7E6}
.btn-navy{background:var(--navy);border-color:var(--navy);color:#fff}
.btn-navy:hover{background:var(--navy-soft);border-color:var(--navy-soft);color:#fff}
.btn-ghost{border-color:transparent;background:transparent}
.btn-ghost:hover{background:var(--surface-2);border-color:var(--border)}
.btn-danger{color:var(--critical);border-color:var(--border-strong)}
.btn-danger:hover{background:rgba(208,59,59,.08);border-color:var(--critical)}
.btn-sm{padding:5px 10px;font-size:12.5px;gap:5px}
.btn-sm svg{width:13px;height:13px}
.btn-icon{padding:7px;border-radius:var(--r-sm)}

.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:600;color:var(--text-secondary)}
.input,select.input,textarea.input{
  width:100%;padding:8px 11px;border:1px solid var(--border-strong);border-radius:var(--r-sm);
  background:var(--surface-1);color:var(--text-primary);transition:border-color .13s,box-shadow .13s;
}
.input:focus{outline:none;border-color:var(--sky);box-shadow:0 0 0 3px rgba(30,136,199,.16)}
textarea.input{min-height:96px;resize:vertical;line-height:1.7}
.input[type=number]{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}

.card{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.card-pad{padding:18px 20px}
.card-head{display:flex;align-items:flex-start;gap:12px;padding:16px 20px;border-bottom:1px solid var(--border)}
.card-head h2{margin:0;font-size:15px;font-weight:600;flex:1}
.card-head .sub{font-size:12px;color:var(--text-muted);font-weight:400;display:block;margin-top:2px}

.grid{display:grid;gap:16px}
.g-kpi{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g-3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}

/* بطاقة مؤشر */
.kpi{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-md);padding:15px 17px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi::before{content:"";position:absolute;inset-inline-start:0;top:0;bottom:0;width:3px;background:var(--sky)}
.kpi.k2::before{background:var(--series-2)}
.kpi.k3::before{background:var(--series-3)}
.kpi.k4::before{background:var(--navy-soft)}
.kpi .lab{font-size:12px;color:var(--text-secondary);font-weight:500;display:flex;align-items:center;gap:6px}
.kpi .val{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:4px;line-height:1.15}
.kpi .val small{font-size:13px;font-weight:600;color:var(--text-muted);letter-spacing:0}
.kpi .hint{font-size:11.5px;color:var(--text-muted);margin-top:2px}

/* شرائح ووسوم */
.tag{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid var(--border-strong);background:var(--surface-2);color:var(--text-secondary)}
.tag svg{width:13px;height:13px;flex:0 0 13px}
.tag.ok{color:#0A7D0A;border-color:rgba(12,163,12,.35);background:rgba(12,163,12,.09)}
.tag.warn{color:#8A5D00;border-color:rgba(250,178,25,.4);background:rgba(250,178,25,.12)}
.tag.crit{color:#A82D2D;border-color:rgba(208,59,59,.35);background:rgba(208,59,59,.09)}
html[data-theme="dark"] .tag.ok{color:#5CD35C}
html[data-theme="dark"] .tag.warn{color:#F7C75A}
html[data-theme="dark"] .tag.crit{color:#F08080}
.dot{width:9px;height:9px;border-radius:3px;flex:0 0 9px;display:inline-block}

/* جداول */
.tbl-wrap{overflow-x:auto}
table.tbl{font-size:13.5px}
table.tbl th{
  text-align:right;font-size:11.5px;font-weight:600;color:var(--text-muted);
  padding:9px 12px;border-bottom:1px solid var(--border-strong);white-space:nowrap;background:var(--surface-2);
}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--grid);vertical-align:middle}
table.tbl tbody tr:hover{background:var(--surface-2)}
table.tbl tbody tr:last-child td{border-bottom:0}
table.tbl td.n,table.tbl th.n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
.row-actions{display:flex;gap:4px;justify-content:flex-start}
.empty{padding:34px 20px;text-align:center;color:var(--text-muted);font-size:13.5px}
.empty svg{width:34px;height:34px;opacity:.4;margin-bottom:8px}

/* بطاقات المكاتب */
.office-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(min(100%,272px),1fr))}
.office-card{
  background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-md);padding:15px 16px;
  box-shadow:var(--shadow);cursor:pointer;transition:border-color .13s,transform .1s,box-shadow .13s;
  display:flex;flex-direction:column;gap:10px;text-align:right;
}
.office-card:hover{border-color:var(--sky);transform:translateY(-2px)}
.office-card .oc-top{display:flex;align-items:flex-start;gap:10px}
.oc-badge{
  width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:var(--sky-tint);color:var(--sky);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;
}
.oc-name{font-weight:600;font-size:14.5px;line-height:1.35}
.oc-loc{font-size:11.5px;color:var(--text-muted)}
.oc-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;border-top:1px solid var(--grid);padding-top:10px}
.oc-stat .k{font-size:10.5px;color:var(--text-muted)}
.oc-stat .v{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;direction:ltr;text-align:right}
.mini-bar{height:5px;border-radius:3px;background:var(--grid);overflow:hidden;display:flex;gap:2px}
.mini-bar i{display:block;height:100%;border-radius:3px}

/* الرسوم */
.chart-box{position:relative}
.chart-svg{display:block;width:100%;overflow:visible;direction:ltr}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;padding:2px 20px 14px;font-size:12px;color:var(--text-secondary)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{
  position:fixed;z-index:200;pointer-events:none;opacity:0;transform:translateY(3px);
  background:var(--navy-deep);color:#fff;border-radius:10px;padding:9px 12px;font-size:12.5px;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.5);max-width:270px;transition:opacity .1s;line-height:1.6;
  border:1px solid rgba(255,255,255,.12);
}
.tip.on{opacity:1;transform:translateY(0)}
.tip b{display:block;font-size:13px;margin-bottom:3px}
.tip .r{display:flex;align-items:center;gap:7px;justify-content:space-between}
.tip .r .v{font-variant-numeric:tabular-nums;direction:ltr;font-weight:600}
.axis-txt{font-size:11px;fill:var(--text-muted)}
.chart-svg text{unicode-bidi:plaintext}
.bar-lab{font-size:11.5px;fill:var(--text-secondary);font-weight:600;stroke:var(--surface-1);stroke-width:3px;paint-order:stroke fill;stroke-linejoin:round}
.view-toggle{display:inline-flex;border:1px solid var(--border-strong);border-radius:var(--r-sm);overflow:hidden}
.view-toggle button{padding:5px 11px;font-size:12px;font-weight:500;color:var(--text-secondary);background:var(--surface-1)}
.view-toggle button+button{border-inline-start:1px solid var(--border-strong)}
.view-toggle button.on{background:var(--sky);color:#fff;font-weight:600}

/* شرائح تنقّل داخلي */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs button{padding:9px 15px;font-size:13.5px;font-weight:500;color:var(--text-secondary);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--sky);border-bottom-color:var(--sky);font-weight:600}

/* نافذة منبثقة */
.modal-bg{position:fixed;inset:0;background:rgba(10,29,52,.55);backdrop-filter:blur(3px);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}
.modal-bg.on{display:flex}
.modal{background:var(--surface-1);border-radius:var(--r-xl);box-shadow:0 30px 70px -20px rgba(0,0,0,.5);width:100%;max-width:540px;max-height:88vh;display:flex;flex-direction:column;border:1px solid var(--border)}
.modal.wide{max-width:760px}
.modal-head{padding:17px 21px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.modal-head h3{margin:0;font-size:16px;font-weight:600;flex:1}
.modal-body{padding:20px 21px;overflow-y:auto}
.modal-foot{padding:14px 21px;border-top:1px solid var(--border);display:flex;gap:9px;justify-content:flex-start;background:var(--surface-2);border-radius:0 0 var(--r-xl) var(--r-xl)}
.form-grid{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.form-grid .full{grid-column:1/-1}

/* تنبيه */
.banner{display:flex;gap:11px;align-items:flex-start;padding:12px 15px;border-radius:var(--r-md);font-size:13px;margin-bottom:16px;border:1px solid}
.banner.warn{background:rgba(250,178,25,.10);border-color:rgba(250,178,25,.4);color:var(--text-primary)}
.banner.info{background:var(--sky-tint);border-color:rgba(30,136,199,.3)}
.banner svg{width:18px;height:18px;flex:0 0 18px;margin-top:2px}
.banner b{font-weight:600}

/* تقارير */
.rep-list{display:flex;flex-direction:column;gap:9px}
.rep{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2)}
.rep-ico{width:36px;height:36px;flex:0 0 36px;border-radius:9px;background:rgba(208,59,59,.10);color:var(--critical);display:flex;align-items:center;justify-content:center}
.rep-ico svg{width:19px;height:19px}
.rep-meta{flex:1;min-width:0}
.rep-meta .n{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rep-meta .d{font-size:11.5px;color:var(--text-muted)}
.drop{
  border:2px dashed var(--border-strong);border-radius:var(--r-md);padding:26px 18px;text-align:center;
  color:var(--text-muted);font-size:13px;transition:border-color .13s,background .13s;cursor:pointer;
}
.drop:hover,.drop.over{border-color:var(--sky);background:var(--sky-tint);color:var(--sky)}
.drop svg{width:26px;height:26px;margin-bottom:6px;opacity:.6}

.search-wrap{position:relative;flex:0 1 280px}
.search-wrap svg{position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-muted);pointer-events:none}
.search-wrap input{padding-inline-start:32px}

.toast{
  position:fixed;bottom:22px;inset-inline-start:22px;z-index:300;background:var(--navy-deep);color:#fff;
  padding:11px 17px;border-radius:var(--r-md);font-size:13.5px;box-shadow:0 14px 40px -10px rgba(0,0,0,.55);
  opacity:0;transform:translateY(10px);transition:opacity .18s,transform .18s;pointer-events:none;
  display:flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.14);
}
.toast.on{opacity:1;transform:translateY(0)}
.toast svg{width:16px;height:16px}

.hide{display:none !important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.mono-note{font-size:11.5px;color:var(--text-muted);line-height:1.7}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .sidebar{position:static;height:auto;flex-direction:row;align-items:center;gap:14px;overflow-x:auto;padding:12px 14px}
  .sidebar .nav-label,.side-foot{display:none}
  .brand{flex-direction:row;align-items:center;margin:0;padding:6px 10px;border-radius:9px;border-bottom:0;gap:9px}
  .brand-logo img{max-width:92px}
  .nav{flex-direction:row}
  .brand-sub{display:none}
  .content{padding:16px 14px 50px}
  .topbar{padding:11px 14px}
  .form-grid{grid-template-columns:1fr}
}
@media print{
  .sidebar,.topbar,.tabs,.no-print,.view-toggle{display:none !important}
  body{background:#fff}
  .app{grid-template-columns:1fr}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
  .content{padding:0;max-width:none}
}
@media (forced-colors:active){
  .kpi::before,.dot,.mini-bar i{forced-color-adjust:none}
}

/* ======================= تقرير الأداء (PDF) ======================= */
#reportRoot{display:none;position:fixed;inset:0;z-index:500;background:#E9EDF2;overflow:auto;padding:0 0 60px}
body.reporting{overflow:hidden}
body.reporting #reportRoot{display:block}
.rp-bar{
  position:sticky;top:0;z-index:10;background:var(--navy);color:#fff;padding:11px 20px;
  display:flex;align-items:center;gap:10px;box-shadow:0 4px 18px -6px rgba(0,0,0,.4);
}
.rp-bar .t{font-weight:600;font-size:14.5px;flex:1}
.rp-bar .btn{background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.28);color:#fff}
.rp-bar .btn:hover{background:rgba(255,255,255,.20);border-color:#fff}
.rp-bar .btn-primary{background:var(--sky);border-color:var(--sky)}
.rp-page{
  width:210mm;min-height:297mm;margin:22px auto;background:#fff;color:#0B1B30;
  padding:16mm 14mm 18mm;box-shadow:0 18px 50px -18px rgba(15,42,74,.4);
}
.rp-head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #0F2A4A;padding-bottom:12px}
.rp-head .lg{width:124px;flex:0 0 124px;display:flex;align-items:center}
.rp-head .lg img{width:100%;height:auto;display:block}
.rp-head .org{font-size:16px;font-weight:700;color:#0F2A4A;line-height:1.35}
.rp-head .unit{font-size:11.5px;color:#4A5A70;margin-top:2px}
.rp-head .mt{margin-inline-start:auto;text-align:left;font-size:11px;color:#4A5A70;line-height:1.8;direction:rtl}
.rp-head .mt b{color:#0F2A4A}
.rp-title{font-size:21px;font-weight:700;color:#0F2A4A;margin:20px 0 2px;letter-spacing:-.3px}
.rp-title-sub{font-size:12.5px;color:#4A5A70;margin-bottom:18px}
.rp-h2{
  font-size:14.5px;font-weight:700;color:#0F2A4A;margin:22px 0 10px;padding-inline-start:10px;
  border-inline-start:4px solid #1E88C7;line-height:1.4;
}
.rp-p{font-size:12.8px;line-height:2;color:#243B57;margin:0 0 10px;text-align:justify}
.rp-p b{color:#0F2A4A}
.rp-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin:12px 0 4px}
.rp-kpi{border:1px solid #DCE4EC;border-radius:9px;padding:10px 12px;background:#F7FAFC}
.rp-kpi .k{font-size:10.5px;color:#4A5A70}
.rp-kpi .v{font-size:18px;font-weight:700;color:#0F2A4A;font-variant-numeric:tabular-nums;direction:rtl;margin-top:1px}
.rp-kpi .v small{font-size:11px;font-weight:600;color:#78899E}
table.rp-tbl{width:100%;border-collapse:collapse;font-size:11.4px}
table.rp-tbl th{background:#0F2A4A;color:#fff;font-weight:600;padding:7px 8px;text-align:right;font-size:10.8px;white-space:nowrap}
table.rp-tbl td{padding:6px 8px;border-bottom:1px solid #E4EAF1}
table.rp-tbl td:nth-child(2){min-width:94px}
table.rp-tbl tbody tr:nth-child(even){background:#F7FAFC}
table.rp-tbl td.n,table.rp-tbl th.n{text-align:left;font-variant-numeric:tabular-nums;direction:ltr}
table.rp-tbl tfoot td{background:#E7F2FA;font-weight:700;border-top:2px solid #0F2A4A;padding:7px 8px}
.rp-flags{display:flex;flex-direction:column;gap:7px;font-size:12.2px}
.rp-flag{display:flex;gap:9px;align-items:flex-start;border:1px solid #DCE4EC;border-radius:9px;padding:9px 11px;background:#F7FAFC;line-height:1.7}
.rp-flag i{width:8px;height:8px;border-radius:3px;flex:0 0 8px;margin-top:7px}
.rp-note{font-size:11px;color:#78899E;line-height:1.8;margin-top:8px}
.rp-foot{margin-top:26px;padding-top:10px;border-top:1px solid #DCE4EC;display:flex;gap:10px;font-size:10.5px;color:#78899E}
.rp-sign{display:grid;gap:22px;margin-top:34px}
.rp-sign.c2{grid-template-columns:1fr 1fr}
.rp-sign.c3{grid-template-columns:repeat(3,1fr)}
.rp-sign .box{text-align:center}
.rp-sign .t{display:block;font-size:11px;color:#4A5A70;line-height:1.5}
.rp-sign .n{display:block;font-size:13.5px;font-weight:700;color:#0F2A4A;margin-top:3px}
.rp-sign .line{margin-top:34px;border-top:1px solid #B8C4D2;padding-top:6px;font-size:10.5px;color:#78899E}
.rp-break{break-before:page;page-break-before:always}
.rp-avoid{break-inside:avoid;page-break-inside:avoid}
@media print{
  body.reporting .app{display:none !important}
  body.reporting #reportRoot{display:block;position:static;background:#fff;padding:0;overflow:visible}
  body.reporting{overflow:visible}
  .rp-bar{display:none !important}
  .rp-page{width:auto;min-height:0;margin:0;padding:0;box-shadow:none}
  table.rp-tbl thead{display:table-header-group}
  .rp-kpis{grid-template-columns:repeat(3,1fr)}
  @page{size:A4;margin:14mm 12mm}
}
@media screen and (max-width:860px){ .rp-page{width:auto;margin:12px;padding:16px} .rp-kpis{grid-template-columns:1fr 1fr} }

/* ===== نسخة الويب: عرض فقط (البيانات مصدرها Google Sheets) ===== */
html.ro #addOffice, html.ro #bulkName, html.ro #bulkName2, html.ro #editOffice,
html.ro #addEmp, html.ro #bulkEmp, html.ro #addRep, html.ro #repDrop,
html.ro [data-emp-edit], html.ro [data-emp-del], html.ro [data-rep-del], html.ro [data-rep-dl],
html.ro #expData, html.ro #expFull, html.ro #impData, html.ro #saveMeta,
html.ro #pickLogo, html.ro #rmLogo, html.ro #applyCount, html.ro #resetAll,
html.ro #exportBtn, html.ro .drop { display:none !important }
html.ro [data-bud], html.ro #bH1, html.ro #bH2 {
  pointer-events:none; background:var(--surface-2); border-color:transparent; color:var(--text-primary);
}
html.ro .field input, html.ro .field select, html.ro .field textarea { pointer-events:none; background:var(--surface-2) }
.sync{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-muted);white-space:nowrap}
.sync .st{width:8px;height:8px;border-radius:50%;background:var(--good);flex:0 0 8px}
.sync .st.load{background:var(--warning);animation:pulse 1s infinite}
.sync .st.err{background:var(--critical)}
@keyframes pulse{50%{opacity:.35}}
.src-card{display:flex;flex-direction:column;gap:10px}
.src-row{display:flex;align-items:center;gap:10px;font-size:13px;padding:9px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface-2)}
.src-row b{font-weight:600}
.src-row .ok{color:#0A7D0A}.src-row .bad{color:var(--critical)}
html[data-theme="dark"] .src-row .ok{color:#5CD35C}
</style>

const uid = p => p + Math.random().toString(36).slice(2,9) + (performance.now()|0).toString(36);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf  = new Intl.NumberFormat('en-US');
const nf1 = new Intl.NumberFormat('en-US',{maximumFractionDigits:1});
const num = v => nf.format(Math.round(Number(v)||0));
const pct = v => (Number(v)||0).toFixed(1)+'%';
const compact = v => {
  v = Number(v)||0;
  if (Math.abs(v) >= 1e9) return nf1.format(v/1e9)+' مليار';
  if (Math.abs(v) >= 1e6) return nf1.format(v/1e6)+' م';
  if (Math.abs(v) >= 1e3) return nf1.format(v/1e3)+' ألف';
  return nf.format(v);
};
const todayISO = () => new Date().toISOString().slice(0,10);
const fmtDate = d => { if(!d) return '—'; const t=new Date(d); return isNaN(t)?String(d):t.toLocaleDateString('ar-EG-u-nu-latn-ca-gregory',{year:'numeric',month:'short',day:'numeric'}); };
const fmtSize = b => { b=Number(b)||0; if(b>=1048576) return nf1.format(b/1048576)+' م.ب'; if(b>=1024) return Math.round(b/1024)+' ك.ب'; return b+' بايت'; };
const clampNum = v => { const n = Number(String(v).replace(/[^\d.\-]/g,'')); return isFinite(n)?n:0; };

function toast(msg, kind='ok'){
  const el = $('#toast');
  el.innerHTML = (kind==='ok'?IC.check:kind==='warn'?IC.alert:IC.info) + '<span>'+esc(msg)+'</span>';
  el.classList.add('on');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>el.classList.remove('on'), 2900);
}

/* ---------------------------------------------------- تخزين ملفات PDF */
const FileStore = {
  db:null, ok:false, mem:new Map(),
  async init(){
    try{
      this.db = await new Promise((res,rej)=>{
        const r = indexedDB.open('wamy-offices-files', 1);
        r.onupgradeneeded = ()=>{ if(!r.result.objectStoreNames.contains('files')) r.result.createObjectStore('files'); };
        r.onsuccess = ()=>res(r.result);
        r.onerror = ()=>rej(r.error);
        setTimeout(()=>rej(new Error('timeout')), 4000);
      });
      this.ok = true;
    }catch(e){ this.ok = false; }
    return this.ok;
  },
  _tx(mode){ return this.db.transaction('files', mode).objectStore('files'); },
  async put(id, blob){
    if(!this.ok){ this.mem.set(id, blob); return; }
    return new Promise((res,rej)=>{ const r=this._tx('readwrite').put(blob,id); r.onsuccess=()=>res(); r.onerror=()=>rej(r.error); });
  },
  async get(id){
    if(!this.ok) return this.mem.get(id) || null;
    return new Promise(res=>{ const r=this._tx('readonly').get(id); r.onsuccess=()=>res(r.result||null); r.onerror=()=>res(null); });
  },
  async del(id){
    if(!this.ok){ this.mem.delete(id); return; }
    return new Promise(res=>{ const r=this._tx('readwrite').delete(id); r.onsuccess=()=>res(); r.onerror=()=>res(); });
  }
};

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    localStorage.setItem(KEY+'.probe','1'); localStorage.removeItem(KEY+'.probe');
    storageOK = true;
    if(raw){ const p = JSON.parse(raw); if(p && Array.isArray(p.offices)) return migrate(p); }
  }catch(e){ storageOK = false; }
  return defaultState();
}
function migrate(p){
  const d = defaultState();
  p.meta = Object.assign({}, d.meta, p.meta||{});
  if(p.meta.unit === 'إدارة المكاتب الدولية') p.meta.unit = d.meta.unit;
  p.offices = p.offices.map((o,i)=>Object.assign(blankOffice(i+1), o, {
    employees: Array.isArray(o.employees)?o.employees:[],
    reports: Array.isArray(o.reports)?o.reports:[]
  }));
  return p;
}

const SHEET_BASE = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQcHr80viY5bvJx8lP_4PmJp44C5sf6pIoYLMBRBXct8hrf-YLXET8mg2xKGcPThG-V5oO2bd13_tRS/pub?single=true&output=csv&gid=";   // قاعدة رابط النشر — يكفي إضافة رقم gid للتبويب
const SHEET_URLS = {

  budgets: "562906278",   // تبويب «الميزانيات» ✔
  reports: "2080758548"    // تبويب «التقارير» ✔
};
const AUTO_REFRESH_MINUTES = 10;

/* ---------------------------------------------------------- محلل CSV ---- */
function csvParse(txt){
  const rows=[]; let row=[], f='', q=false;
  txt = String(txt).replace(/^﻿/,'');
  for(let i=0;i<txt.length;i++){
    const c=txt[i];
    if(q){
      if(c==='"'){ if(txt[i+1]==='"'){ f+='"'; i++; } else q=false; }
      else f+=c;
    } else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'){ row.push(f); rows.push(row); row=[]; f=''; }
    else if(c==='\r'){ /* تجاهل */ }
    else f+=c;
  }
  if(f!=='' || row.length){ row.push(f); rows.push(row); }
  return rows;
}
const cell = (r,i)=> (r && r[i]!=null) ? String(r[i]).trim() : '';
const toNum = v => { const n=Number(String(v==null?'':v).replace(/[^\d.\-]/g,'')); return isFinite(n)?n:0; };
const normName = s => String(s||'').trim().replace(/^مكتب\s+/,'').replace(/\s+/g,' ');

/* --------------------------- تبويب الموظفين (بنية كتل الدول) ------------- */
function parseStaff(txt){
  const rows = csvParse(txt), out = [];
  let cur = null, salIdx = -1;
  rows.forEach(r=>{
    const a=cell(r,0), b=cell(r,1), c=cell(r,2);
    if(/اسم\s*الموظف/.test(c) || /الرقم\s*الوظيفي/.test(b)){          // صف العناوين
      r.forEach((v,i)=>{ if(/الراتب/.test(String(v))) salIdx=i; });
      return;
    }
    if(a && !b && !c){ cur = { name:a, employees:[] }; out.push(cur); return; }  // صف اسم الدولة
    if(!cur || !c) return;
    let sal = salIdx>=0 ? toNum(cell(r,salIdx)) : 0;
    if(!sal) for(let i=r.length-1;i>=5;i--){ const v=toNum(cell(r,i)); if(v){ sal=v; break; } }
    cur.employees.push({ id:uid('e'), empId:b, name:c, title:cell(r,3), type:cell(r,4)||'دوام كلي', dept:'', salary:sal });
  });
  return out;
}
/* ----------------------- تبويب الميزانيات / التقارير (جدول بعناوين) ------ */
function parseTable(txt){
  const rows = csvParse(txt).filter(r=>r.some(v=>String(v).trim()!==''));
  if(!rows.length) return [];
  const head = rows[0].map(h=>String(h).trim());
  const idx = re => head.findIndex(h=>re.test(h));
  return { head, idx, body: rows.slice(1) };
}
function applyBudgets(offices, txt){
  const t = parseTable(txt); if(!t.body) return 0;
  const iName=t.idx(/المكتب|الدولة\s*$/), iCountry=t.idx(/^الدولة/), iCity=t.idx(/المدينة/),
        iMgr=t.idx(/مدير/), iH1=t.idx(/الأول/), iH2=t.idx(/الثاني/);
  let n=0;
  t.body.forEach(r=>{
    const key = normName(cell(r, iName<0?0:iName)); if(!key) return;
    const o = offices.find(x=>normName(x.name)===key || normName(x.country)===key);
    if(!o) return;
    if(iH1>=0) o.h1 = toNum(cell(r,iH1));
    if(iH2>=0) o.h2 = toNum(cell(r,iH2));
    if(iCity>=0 && cell(r,iCity)) o.city = cell(r,iCity);
    if(iCountry>=0 && cell(r,iCountry)) o.country = cell(r,iCountry);
    if(iMgr>=0 && cell(r,iMgr)) o.manager = cell(r,iMgr);
    n++;
  });
  return n;
}
function applyReports(offices, txt){
  const t = parseTable(txt); if(!t.body) return 0;
  const iName=t.idx(/المكتب/), iTitle=t.idx(/اسم\s*التقرير|التقرير/), iPer=t.idx(/الفترة/),
        iUrl=t.idx(/رابط|الرابط|URL/i);
  let iDate=t.idx(/التاريخ|تاريخ/);
  if(iDate<0) iDate = (t.head.length>3 && iUrl!==3) ? 3 : -1;
  let n=0;
  t.body.forEach(r=>{
    const key = normName(cell(r, iName<0?0:iName)); if(!key) return;
    const o = offices.find(x=>normName(x.name)===key || normName(x.country)===key);
    if(!o) return;
    const url = cell(r,iUrl);
    if(/\/\.\.\.\//.test(url)) return;      // صف مثال في القالب
    const per = cell(r,iPer);
    o.reports.push({ id:uid('r'), kind:'link', name: cell(r,iTitle)||'تقرير',
      period: /الأول|h1/i.test(per)?'h1' : /الثاني|h2/i.test(per)?'h2' : /سنوي|annual/i.test(per)?'annual':'other',
      date: iDate>=0?cell(r,iDate):'', url });
    n++;
  });
  return n;
}

/* ------------------------------------------------------------ المزامنة -- */
let SYNC = { at:null, ok:false, msg:'لم تُضبط روابط الشيت بعد', counts:{} };
function paintSync(state, text){
  const d=$('#syncDot'), t=$('#syncTxt'); if(!d) return;
  d.className = 'st' + (state==='load'?' load':state==='err'?' err':'');
  t.textContent = text;
}
async function grab(url){
  if(/^\d+$/.test(String(url).trim())) url = SHEET_BASE + String(url).trim();   // gid فقط
  const u = url + (url.includes('?')?'&':'?') + 'cachebust=' + Math.floor(Date.now()/30000);
  const res = await fetch(u, {cache:'no-store'});
  if(!res.ok) throw new Error('HTTP '+res.status);
  return res.text();
}
async function syncFromSheet(showToast){
  if(!SHEET_URLS.staff){ paintSync('err','بيانات مدمجة'); return false; }
  paintSync('load','جارٍ التحديث…');
  try{
    const staffTxt = await grab(SHEET_URLS.staff);
    const blocks = parseStaff(staffTxt);
    if(!blocks.length) throw new Error('لا توجد بيانات موظفين');
    const offices = blocks.map((b,i)=>Object.assign(blankOffice(i+1), {
      name:'مكتب '+b.name, country:b.name, employees:b.employees, reports:[]
    }));
    offices.forEach(o=>{ const m=o.employees.find(e=>/مدير\s*مكتب/.test(e.title)); if(m) o.manager=m.name; });

    const counts = { offices:offices.length, staff:offices.reduce((s,o)=>s+o.employees.length,0), budgets:0, reports:0 };
    if(SHEET_URLS.budgets){ try{ counts.budgets = applyBudgets(offices, await grab(SHEET_URLS.budgets)); }catch(e){} }
    if(SHEET_URLS.reports){ try{ counts.reports = applyReports(offices, await grab(SHEET_URLS.reports)); }catch(e){} }

    S.offices = offices;
    SYNC = { at:new Date(), ok:true, msg:'', counts };
    paintSync('ok','آخر تحديث '+SYNC.at.toLocaleTimeString('ar-EG-u-nu-latn',{hour:'2-digit',minute:'2-digit'}));
    render(); paintSaveState();
    if(showToast) toast('حُدّثت البيانات: '+counts.offices+' مكتب و '+counts.staff+' موظف');
    return true;
  }catch(e){
    SYNC = { at:SYNC.at, ok:false, msg:String(e.message||e), counts:SYNC.counts };
    paintSync('err','تعذّر التحديث');
    if(showToast) toast('تعذّر قراءة الشيت — يُعرض آخر نسخة محفوظة','warn');
    return false;
  }
}

/* ------------------------------------------------------------ حسابات */
const CUR = () => S.meta.currency || 'ر.س';
const money = v => num(v) + ' ' + CUR();
const annualFactor = () => S.meta.salaryPeriod === 'monthly' ? 12 : 1;
const payrollBase = o => (o.employees||[]).reduce((s,e)=>s+(Number(e.salary)||0),0);
const payrollAnnual = o => payrollBase(o) * annualFactor();
const officeTotal = o => (Number(o.h1)||0) + (Number(o.h2)||0);
const ratio = o => { const t = officeTotal(o); return t>0 ? payrollAnnual(o)/t*100 : null; };
const getOffice = id => S.offices.find(o=>o.id===id);
const allEmployees = () => S.offices.flatMap(o=>(o.employees||[]).map(e=>({...e, _office:o})));
const allReports  = () => S.offices.flatMap(o=>(o.reports||[]).map(r=>({...r, _office:o})));
const officeLabel = o => (o.name && o.name.trim()) ? o.name : ('مكتب '+o.code);

function totals(){
  const t = { h1:0, h2:0, total:0, payroll:0, staff:0, reports:0, filled:0, withReports:0 };
  S.offices.forEach(o=>{
    t.h1 += Number(o.h1)||0; t.h2 += Number(o.h2)||0;
    t.payroll += payrollAnnual(o);
    t.staff += (o.employees||[]).length;
    t.reports += (o.reports||[]).length;
    if(officeTotal(o)>0 || (o.employees||[]).length) t.filled++;
    if((o.reports||[]).length) t.withReports++;
  });
  t.total = t.h1 + t.h2;
  t.ratio = t.total>0 ? t.payroll/t.total*100 : null;
  return t;
}
</script>
<script>
/* ============================================================================
   الرسوم البيانية — SVG مبني يدوياً (بلا مكتبات خارجية)
   القواعد: محور واحد، ألوان ثابتة لكل سلسلة، فاصل 2px بين الأجزاء،
   تسميات مباشرة على أطراف الأعمدة، تلميح عند المرور، وبديل جدولي.
   ============================================================================ */
"use strict";

const TIP = () => $('#tip');
function tipShow(html, ev){
  const t = TIP(); t.innerHTML = html; t.classList.add('on');
  const pad = 14, w = t.offsetWidth, h = t.offsetHeight;
  let x = ev.clientX - w - pad; if(x < 8) x = ev.clientX + pad;
  let y = ev.clientY - h - pad; if(y < 8) y = ev.clientY + pad;
  t.style.left = x+'px'; t.style.top = y+'px';
}
function tipHide(){ TIP().classList.remove('on'); }

/* ---------------------------------------------- أعمدة أفقية مكدّسة (RTL) */
/* rows: [{label, sub, parts:[{v,color,name}], total}] — تنمو الأعمدة من اليمين لليسار */
function stackedBars(host, rows, opts){
  opts = Object.assign({ labelW:158, rowH:32, barH:15, maxRows:99, valueFmt:compact, tipFmt:null }, opts||{});
  const W = Math.max(320, host.clientWidth || host.getBoundingClientRect().width || 640);
  const data = rows.slice(0, opts.maxRows);
  if(!data.length){ host.innerHTML = emptyBlock('لا توجد بيانات ميزانية بعد'); return; }

  const labelW = W < 560 ? 116 : opts.labelW;
  const valW   = W < 560 ? 62 : 78;
  const x1 = W - labelW - 16;          // حد العمود الأيمن (نقطة الصفر)
  const x0 = valW + 6;                 // أقصى امتداد لليسار
  const plotW = Math.max(40, x1 - x0);
  const max = Math.max(1, ...data.map(r=>r.total));
  const H = data.length * opts.rowH + 26;

  let ticks = '';
  const step = niceStep(max, 4);
  for(let v = 0; v <= max + 1e-9; v += step){
    const x = x1 - (v/max)*plotW;
    ticks += `<line x1="${x.toFixed(1)}" y1="0" x2="${x.toFixed(1)}" y2="${H-24}" stroke="var(--grid)" stroke-width="1"/>`
          +  `<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" class="axis-txt">${esc(compact(v))}</text>`;
  }

  let bars = '';
  data.forEach((r,i)=>{
    const cy = i*opts.rowH + opts.rowH/2;
    const yb = cy - opts.barH/2;
    let cursor = x1;
    const segs = r.parts.filter(p=>(Number(p.v)||0) > 0);
    segs.forEach((p,pi)=>{
      let w = (Number(p.v)/max)*plotW;
      if(pi < segs.length-1) w = Math.max(0, w - 2);   // فاصل 2px بلون السطح
      const isEnd = pi === segs.length-1;
      bars += barPath(cursor - w, yb, Math.max(1.5,w), opts.barH, isEnd ? 4 : 0, p.color, `data-r="${i}" data-p="${pi}"`);
      cursor -= (Number(p.v)/max)*plotW;
    });
    const endX = x1 - (r.total/max)*plotW;
    bars += `<text x="${(endX-7).toFixed(1)}" y="${(cy+4).toFixed(1)}" text-anchor="end" class="bar-lab">${esc(opts.valueFmt(r.total))}</text>`;
    bars += `<text x="${W-4}" y="${(cy+1).toFixed(1)}" text-anchor="end" font-size="12.5" font-weight="500" fill="var(--text-primary)">${esc(trim(r.label, labelW<130?12:19))}</text>`;
    if(r.sub) bars += `<text x="${W-4}" y="${(cy+13).toFixed(1)}" text-anchor="end" font-size="10.5" fill="var(--text-muted)">${esc(trim(r.sub,22))}</text>`;
    bars += `<rect x="${x0}" y="${(cy-opts.rowH/2).toFixed(1)}" width="${(W-x0)}" height="${opts.rowH}" fill="transparent" data-row="${i}" style="cursor:default"/>`;
  });

  host.innerHTML = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" height="${H}" role="img">
    <line x1="${x1}" y1="0" x2="${x1}" y2="${H-24}" stroke="var(--axis)" stroke-width="1"/>
    ${ticks}${bars}</svg>`;

  host.querySelectorAll('[data-row]').forEach(el=>{
    const r = data[+el.dataset.row];
    el.addEventListener('mousemove', ev=>{
      const inner = r.parts.map(p=>`<div class="r"><span><i class="dot" style="background:${p.color}"></i> ${esc(p.name)}</span><span class="v">${esc(num(p.v))}</span></div>`).join('');
      tipShow(`<b>${esc(r.label)}</b>${inner}<div class="r" style="border-top:1px solid rgba(255,255,255,.18);margin-top:5px;padding-top:5px"><span>الإجمالي</span><span class="v">${esc(num(r.total))} ${esc(CUR())}</span></div>`, ev);
    });
    el.addEventListener('mouseleave', tipHide);
  });
}

/* ---------------------------------------------------- مخطط نقاط (نسبة) */
/* rows: [{label, v, color?}] قيمة واحدة لكل صف + خط مرجعي */
function dotChart(host, rows, opts){
  opts = Object.assign({ labelW:158, rowH:27, refLabel:'المتوسط', suffix:'%', max:null, ref:null }, opts||{});
  const W = Math.max(320, host.clientWidth || 640);
  if(!rows.length){ host.innerHTML = emptyBlock('لا توجد بيانات كافية لحساب النسبة'); return; }
  const labelW = W < 560 ? 116 : opts.labelW;
  const x1 = W - labelW - 10, x0 = 46, plotW = Math.max(40, x1 - x0);
  const max = opts.max || Math.max(10, ...rows.map(r=>r.v)) * 1.08;
  const padT = (opts.ref!=null?20:8);
  const H = rows.length*opts.rowH + 26 + padT;
  const px = v => x1 - (Math.min(v,max)/max)*plotW;

  let ticks='';
  const step = niceStep(max, 4);
  for(let v=0; v<=max+1e-9; v+=step){
    const x = px(v);
    ticks += `<line x1="${x.toFixed(1)}" y1="${padT}" x2="${x.toFixed(1)}" y2="${H-24}" stroke="var(--grid)" stroke-width="1"/>`
          +  `<text x="${x.toFixed(1)}" y="${H-8}" text-anchor="middle" class="axis-txt">${Math.round(v)}${esc(opts.suffix)}</text>`;
  }
  let ref='';
  if(opts.ref!=null && isFinite(opts.ref)){
    const x = px(opts.ref);
    ref = `<line x1="${x.toFixed(1)}" y1="${padT-4}" x2="${x.toFixed(1)}" y2="${H-24}" stroke="var(--navy-soft)" stroke-width="1.5" stroke-dasharray="4 3"/>
           <text x="${(x-4).toFixed(1)}" y="${padT-7}" text-anchor="end" font-size="10.5" fill="var(--text-secondary)" font-weight="600">${esc(opts.refLabel)} ${nf1.format(opts.ref)}${esc(opts.suffix)}</text>`;
  }
  let marks='';
  rows.forEach((r,i)=>{
    const cy = i*opts.rowH + opts.rowH/2 + padT + 2;
    const x = px(r.v);
    const c = r.color || 'var(--series-1)';
    marks += `<line x1="${x1}" y1="${cy}" x2="${x.toFixed(1)}" y2="${cy}" stroke="${c}" stroke-width="2" opacity=".38"/>`;
    marks += `<circle cx="${x.toFixed(1)}" cy="${cy}" r="5.5" fill="${c}" stroke="var(--surface-1)" stroke-width="2"/>`;
    const flip = (x - 11 - 42) < x0;
    marks += `<text x="${(flip? x+11 : x-11).toFixed(1)}" y="${cy+4}" text-anchor="${flip?'start':'end'}" class="bar-lab">${nf1.format(r.v)}${esc(opts.suffix)}</text>`;
    marks += `<text x="${W-4}" y="${cy+4}" text-anchor="end" font-size="12.5" fill="var(--text-primary)">${esc(trim(r.label, labelW<130?12:19))}</text>`;
    marks += `<rect x="${x0}" y="${cy-opts.rowH/2}" width="${W-x0}" height="${opts.rowH}" fill="transparent" data-row="${i}"/>`;
  });
  host.innerHTML = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" height="${H}" role="img">
    <line x1="${x1}" y1="${padT}" x2="${x1}" y2="${H-24}" stroke="var(--axis)" stroke-width="1"/>${ticks}${ref}${marks}</svg>`;
  host.querySelectorAll('[data-row]').forEach(el=>{
    const r = rows[+el.dataset.row];
    el.addEventListener('mousemove', ev=>tipShow(`<b>${esc(r.label)}</b>${esc(r.tip||('النسبة: '+nf1.format(r.v)+opts.suffix))}`, ev));
    el.addEventListener('mouseleave', tipHide);
  });
}

/* ------------------------------------------------------ أعمدة رأسية بسيطة */
function columnChart(host, rows, opts){
  opts = Object.assign({ color:'var(--series-1)', h:190 }, opts||{});
  const W = Math.max(320, host.clientWidth || 640), H = opts.h;
  if(!rows.length){ host.innerHTML = emptyBlock('لا توجد بيانات'); return; }
  const padB = 40, padT = 22, x0 = 74, x1 = W - 8;
  const max = Math.max(1, ...rows.map(r=>r.v));
  const step = niceStep(max,3);
  const bw = Math.min(58, (x1-x0)/rows.length - 10);
  const py = v => H - padB - (v/max)*(H-padB-padT);
  let g='';
  for(let v=0; v<=max+1e-9; v+=step){
    const y=py(v);
    g += `<line x1="${x0}" y1="${y.toFixed(1)}" x2="${x1}" y2="${y.toFixed(1)}" stroke="var(--grid)" stroke-width="1"/>
          <text x="${x0-6}" y="${(y+4).toFixed(1)}" text-anchor="end" class="axis-txt">${esc(compact(v))}</text>`;
  }
  let bars='';
  rows.forEach((r,i)=>{
    const cx = x0 + ((x1-x0)/rows.length)*(i+0.5);
    const y = py(r.v), h = H-padB-y;
    bars += barPathV(cx-bw/2, y, bw, Math.max(2,h), 4, r.color||opts.color, `data-row="${i}"`);
    bars += `<text x="${cx.toFixed(1)}" y="${(y-7).toFixed(1)}" text-anchor="middle" class="bar-lab">${esc(compact(r.v))}</text>`;
    bars += `<text x="${cx.toFixed(1)}" y="${H-22}" text-anchor="middle" font-size="12" fill="var(--text-primary)">${esc(trim(r.label,14))}</text>`;
    if(r.sub) bars += `<text x="${cx.toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="var(--text-muted)">${esc(r.sub)}</text>`;
  });
  host.innerHTML = `<svg class="chart-svg" viewBox="0 0 ${W} ${H}" height="${H}" role="img">${g}
    <line x1="${x0}" y1="${H-padB}" x2="${x1}" y2="${H-padB}" stroke="var(--axis)" stroke-width="1"/>${bars}</svg>`;
  host.querySelectorAll('[data-row]').forEach(el=>{
    const r = rows[+el.dataset.row];
    el.addEventListener('mousemove', ev=>tipShow(`<b>${esc(r.label)}</b><div class="r"><span>${esc(r.sub||'القيمة')}</span><span class="v">${esc(num(r.v))}</span></div>`, ev));
    el.addEventListener('mouseleave', tipHide);
  });
}

/* --------------------------------------------------------------- مساعدات */
function barPath(x,y,w,h,r,fill,attrs){
  r = Math.min(r, h/2, w);
  if(r<=0) return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${h}" fill="${fill}" ${attrs||''}/>`;
  // زوايا مستديرة على الطرف الأيسر (طرف النمو)
  return `<path d="M ${(x+r).toFixed(1)} ${y} H ${(x+w).toFixed(1)} V ${(y+h)} H ${(x+r).toFixed(1)} A ${r} ${r} 0 0 1 ${x.toFixed(1)} ${(y+h-r).toFixed(1)} V ${(y+r).toFixed(1)} A ${r} ${r} 0 0 1 ${(x+r).toFixed(1)} ${y} Z" fill="${fill}" ${attrs||''}/>`;
}
function barPathV(x,y,w,h,r,fill,attrs){
  r = Math.min(r, w/2, h);
  return `<path d="M ${x.toFixed(1)} ${(y+r).toFixed(1)} A ${r} ${r} 0 0 1 ${(x+r).toFixed(1)} ${y.toFixed(1)} H ${(x+w-r).toFixed(1)} A ${r} ${r} 0 0 1 ${(x+w).toFixed(1)} ${(y+r).toFixed(1)} V ${(y+h).toFixed(1)} H ${x.toFixed(1)} Z" fill="${fill}" ${attrs||''}/>`;
}
function niceStep(max, target){
  const raw = max/Math.max(1,target);
  const mag = Math.pow(10, Math.floor(Math.log10(raw||1)));
  const n = raw/mag;
  const m = n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10;
  return m*mag;
}
function trim(s, n){ s = String(s||''); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function emptyBlock(msg){
  return `<div class="empty">${IC.box}<div>${esc(msg)}</div></div>`;
}
function legend(items){
  return `<div class="legend">${items.map(i=>`<span><i class="dot" style="background:${i.color}"></i>${esc(i.name)}</span>`).join('')}</div>`;
}
</script>
<script>
/* ============================================================================
   الشاشات
   ============================================================================ */
"use strict";

let VIEW = 'dash', CUR_OFFICE = null, SEARCH = '', chartJobs = [];
const PERIODS = { h1:'النصف الأول', h2:'النصف الثاني', annual:'تقرير سنوي', other:'أخرى' };

function go(view, officeId){
  VIEW = view; if(officeId!==undefined) CUR_OFFICE = officeId;
  $$('.nav a').forEach(a=>a.classList.toggle('active', a.dataset.nav === (view==='office'?'offices':view)));
  render(); window.scrollTo({top:0});
}

function render(){
  chartJobs = [];
  const c = $('#content');
  const titles = { dash:'لوحة المؤشرات', offices:'المكاتب الدولية', office:'تفاصيل المكتب',
                   staff:'الموظفون', hr:'الموارد البشرية', budget:'الميزانيات', reports:'التقارير',
                   settings:'مصدر البيانات والإعدادات' };
  $('#pageTitle').textContent = titles[VIEW] || '';
  $('#globalSearchWrap').classList.toggle('hide', !['offices','staff','reports'].includes(VIEW));
  c.innerHTML = ({ dash:viewDash, offices:viewOffices, office:viewOffice, staff:viewStaff, hr:viewHR,
                   budget:viewBudget, reports:viewReports, settings:viewSettings })[VIEW]();
  bind();
  runCharts();
}
function runCharts(){ chartJobs.forEach(f=>{ try{ f(); }catch(e){ console.error(e); } }); }

function storageBanner(){
  return '';
  if(storageOK) return '';
  return `<div class="banner warn">${IC.alert}<div><b>الحفظ التلقائي غير متاح في هذه النافذة.</b>
    البيانات موجودة أثناء الجلسة فقط. احفظ ملف اللوحة على جهازك وافتحه من هناك، أو اضغط
    «نسخة احتياطية» بعد كل إدخال.</div></div>`;
}

/* ============================================================ لوحة المؤشرات */
function viewDash(){
  const t = totals();
  const withData = S.offices.filter(o=>officeTotal(o)>0);
  const noReports = S.offices.filter(o=>!(o.reports||[]).length);
  const empty = S.offices.filter(o=>officeTotal(o)===0 && !(o.employees||[]).length);

  return storageBanner() + `
  <div class="grid g-kpi" style="margin-bottom:18px">
    ${kpi('إجمالي الميزانيات', num(t.total), CUR(), 'النصف الأول '+compact(t.h1)+' · الثاني '+compact(t.h2), '')}
    ${kpi('إجمالي الرواتب السنوية', num(t.payroll), CUR(), t.ratio!=null?('يمثّل '+pct(t.ratio)+' من الميزانية'):'—', 'k2')}
    ${kpi('عدد الموظفين', num(t.staff), 'موظف', 'في '+num(S.offices.filter(o=>(o.employees||[]).length).length)+' مكتب', 'k3')}
    ${kpi('المكاتب', num(S.offices.length), 'مكتب', num(t.filled)+' مكتب مكتمل البيانات', 'k4')}
  </div>

  <div class="grid g-2" style="margin-bottom:18px">
    <section class="card">
      <div class="card-head">
        <h2>الميزانية حسب المكتب<span class="sub">أكبر 12 مكتباً — النصف الأول والنصف الثاني (${esc(CUR())})</span></h2>
        ${viewToggle('c1')}
      </div>
      ${legend([{name:'النصف الأول',color:'var(--series-1)'},{name:'النصف الثاني',color:'var(--series-2)'}])}
      <div class="chart-box card-pad" style="padding-top:0" id="c1"></div>
      <div id="c1t" class="hide tbl-wrap"></div>
    </section>

    <section class="card">
      <div class="card-head">
        <h2>نسبة الرواتب من الميزانية<span class="sub">الرواتب السنوية ÷ ميزانية المكتب — أعلى 12</span></h2>
        ${viewToggle('c2')}
      </div>
      <div class="chart-box card-pad" id="c2"></div>
      <div id="c2t" class="hide tbl-wrap"></div>
    </section>
  </div>

  <div class="grid g-2">
    <section class="card">
      <div class="card-head"><h2>حالة التقارير<span class="sub">المكاتب التي لم تُرفع لها تقارير بعد</span></h2></div>
      <div class="card-pad" style="padding-top:14px">
        <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px">
          <span class="tag ok">${IC.check} ${num(t.withReports)} مكتب سلّم</span>
          <span class="tag ${noReports.length?'warn':'ok'}">${IC.alert} ${num(noReports.length)} مكتب بلا تقارير</span>
          <span class="tag">${num(t.reports)} تقرير مرفوع</span>
        </div>
        ${noReports.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px">${
          noReports.slice(0,28).map(o=>`<button class="tag" data-open="${o.id}" style="cursor:pointer">${esc(officeLabel(o))}</button>`).join('')
        }${noReports.length>28?`<span class="tag">+${noReports.length-28}</span>`:''}</div>`
        : `<div class="empty" style="padding:18px">${IC.check}<div>جميع المكاتب سلّمت تقاريرها</div></div>`}
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>أعلى الرواتب حسب المكتب<span class="sub">إجمالي الرواتب السنوية — أعلى 6 مكاتب</span></h2></div>
      <div class="chart-box card-pad" id="c3"></div>
    </section>
  </div>

  ${empty.length ? `<div class="banner info" style="margin-top:18px">${IC.info}<div>
     <b>${num(empty.length)} مكتب بانتظار الإدخال.</b> اذهب إلى <a href="#" data-nav-link="offices">المكاتب</a>
     لإدخال الأسماء والميزانيات والموظفين. يمكنك تسمية كل المكاتب مرة واحدة عبر «تسمية جماعية».</div></div>` : ''}

  ${(()=>{
     chartJobs.push(()=>{
       const rows = withData.sort((a,b)=>officeTotal(b)-officeTotal(a)).slice(0,12).map(o=>({
         label: officeLabel(o), sub: [o.city,o.country].filter(Boolean).join('، '),
         total: officeTotal(o),
         parts: [{name:'النصف الأول', v:Number(o.h1)||0, color:'var(--series-1)'},
                 {name:'النصف الثاني', v:Number(o.h2)||0, color:'var(--series-2)'}]
       }));
       stackedBars($('#c1'), rows, {});
       $('#c1t').innerHTML = simpleTable(['المكتب','النصف الأول','النصف الثاني','الإجمالي'],
         rows.map(r=>[r.label, num(r.parts[0].v), num(r.parts[1].v), num(r.total)]), [false,true,true,true]);

       const rr = withData.map(o=>({label:officeLabel(o), v:ratio(o)||0,
              tip:'الرواتب السنوية '+num(payrollAnnual(o))+' من ميزانية '+num(officeTotal(o))}))
              .filter(r=>r.v>0).sort((a,b)=>b.v-a.v).slice(0,12);
       const avg = rr.length? rr.reduce((s,r)=>s+r.v,0)/rr.length : null;
       dotChart($('#c2'), rr, {ref:avg, refLabel:'المتوسط'});
       $('#c2t').innerHTML = simpleTable(['المكتب','نسبة الرواتب'], rr.map(r=>[r.label, nf1.format(r.v)+'%']), [false,true]);

       const top = S.offices.filter(o=>payrollAnnual(o)>0).sort((a,b)=>payrollAnnual(b)-payrollAnnual(a)).slice(0,6)
         .map(o=>({label:officeLabel(o), v:payrollAnnual(o), sub:(o.employees||[]).length+' موظف'}));
       columnChart($('#c3'), top, {});
     });
     return '';
  })()}`;
}
function kpi(lab, val, unit, hint, cls){
  return `<div class="kpi ${cls||''}"><div class="lab">${esc(lab)}</div>
    <div class="val"><span class="num">${esc(val)}</span> <small>${esc(unit)}</small></div>
    <div class="hint">${esc(hint)}</div></div>`;
}
function viewToggle(id){
  return `<div class="view-toggle no-print" data-vt="${id}">
    <button class="on" data-mode="chart">رسم</button><button data-mode="table">جدول</button></div>`;
}
function simpleTable(head, rows, nums){
  return `<table class="tbl"><thead><tr>${head.map((h,i)=>`<th class="${nums&&nums[i]?'n':''}">${esc(h)}</th>`).join('')}</tr></thead>
    <tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${nums&&nums[i]?'n':''}">${esc(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
}

/* ================================================================ المكاتب */
function viewOffices(){
  const q = SEARCH.trim();

function matchOffice(o,q){
  const s = [o.name,o.code,o.country,o.city,o.manager].join(' ').toLowerCase();
  return s.includes(q.toLowerCase()) || (o.employees||[]).some(e=>(e.name+' '+e.title+' '+(e.empId||'')).toLowerCase().includes(q.toLowerCase()));
}

/* ============================================================================
   الموارد البشرية — توزيع المسميات وتغطية الوظائف الأساسية ونوع الدوام
   ============================================================================ */
const ROLES = [
  { label:'مدير المكتب',            re:/مدير\s*مكتب/ },
  { label:'محاسب',                  re:/محاسب/ },
  { label:'منسق تعليمي ودعوي',      re:/منسق\s*تعليمي|دعوي/ },
  { label:'منسق مشاريع وأيتام',     re:/منسق\s*مشاريع|ايتام|أيتام/ },
  { label:'سكرتير / إداري',         re:/سكرتير|ادار|إدار/ },
  { label:'سائق',                   re:/سائق/ },
  { label:'خدمات وصيانة وحراسة',    re:/عامل\s*خدمات|حارس|فني\s*صيانة/ }
];
const isPart = e => /جزئي/.test(e.type||'');
const hasRole = (o, re) => (o.employees||[]).some(e=>re.test(e.title||''));
function roleCoverage(offices){
  const active = offices.filter(o=>(o.employees||[]).length);
  return ROLES.map(r=>{
    const have = active.filter(o=>hasRole(o,r.re));
    const miss = active.filter(o=>!hasRole(o,r.re));
    const count = active.reduce((s,o)=>s+(o.employees||[]).filter(e=>r.re.test(e.title||'')).length,0);
    return { ...r, have, miss, count, base:active.length };
  });
}
function titleStats(){
  const m = new Map();
  allEmployees().forEach(e=>{
    const k = (e.title||'غير محدد').trim();
    const g = m.get(k) || { title:k, n:0, sal:0, offices:new Set(), part:0 };
    g.n++; g.sal += Number(e.salary)||0; g.offices.add(e._office.id); if(isPart(e)) g.part++;
    m.set(k,g);
  });
  return [...m.values()].sort((a,b)=>b.n-a.n);
}

  <section class="card">
    <div class="card-head"><h2>جدول الميزانيات<span class="sub">تعديل سريع — اكتب المبلغ واخرج من الحقل ليُحفظ</span></h2>
      <button class="btn btn-sm no-print" id="csvBudget">${IC.dl} تصدير CSV</button>

    <div class="tbl-wrap"><table class="tbl">
      <thead><tr><th style="width:44px">الرمز</th><th>المكتب</th><th>الدولة</th>

        <td style="font-weight:600"><button class="btn btn-sm btn-ghost" data-open="${o.id}" style="padding:2px 4px">${esc(officeLabel(o))}</button></td>

        <td class="n"><input class="input" type="number" step="any" min="0" data-bud="${o.id}" data-half="h1" value="${Number(o.h1)||0}" ${RO()?'readonly tabindex="-1"':''} style="padding:4px 8px;text-align:left"></td>
        <td class="n"><input class="input" type="number" step="any" min="0" data-bud="${o.id}" data-half="h2" value="${Number(o.h2)||0}" ${RO()?'readonly tabindex="-1"':''} style="padding:4px 8px;text-align:left"></td>

        <td class="n">${num(payrollAnnual(o))}</td>

      <tfoot><tr style="border-top:2px solid var(--border-strong)">
        <td></td><td style="font-weight:700">الإجمالي</td><td></td>
        <td class="n" style="font-weight:700">${num(t.h1)}</td><td class="n" style="font-weight:700">${num(t.h2)}</td>
        <td class="n" style="font-weight:700">${num(t.total)}</td><td class="n" style="font-weight:700">${num(t.payroll)}</td>
        <td class="n" style="font-weight:700">${t.ratio!=null?nf1.format(t.ratio)+'%':'—'}</td></tr></tfoot>
    </table></div>
  </section>

  ${(()=>{ chartJobs.push(()=>{
      const r = withData.map(o=>({label:officeLabel(o), sub:o.country, total:officeTotal(o),
        parts:[{name:'النصف الأول',v:Number(o.h1)||0,color:'var(--series-1)'},
               {name:'النصف الثاني',v:Number(o.h2)||0,color:'var(--series-2)'}]}));
      stackedBars($('#b1'), r, {});

    }); return ''; })()}`;
}

/* ================================================================ التقارير */
function viewReports(){
  const q = SEARCH.trim().toLowerCase();
  let reps = allReports();
  if(q) reps = reps.filter(r=>(r.name+' '+officeLabel(r._office)).toLowerCase().includes(q));
  reps.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  const byPeriod = k => allReports().filter(r=>r.period===k).length;
  const missing = S.offices.filter(o=>!(o.reports||[]).length);
  return storageBanner() + `
  <div class="grid g-kpi" style="margin-bottom:18px">
    ${kpi('إجمالي التقارير', num(allReports().length), 'تقرير', '', '')}
    ${kpi('تقارير النصف الأول', num(byPeriod('h1')), 'تقرير', '', 'k2')}
    ${kpi('تقارير النصف الثاني', num(byPeriod('h2')), 'تقرير', '', 'k3')}
    ${kpi('مكاتب بلا تقارير', num(missing.length), 'مكتب', 'من ' + num(S.offices.length), 'k4')}
  </div>
  <section class="card" style="margin-bottom:18px">
    <div class="card-head"><h2>كل التقارير<span class="sub">الأحدث أولاً — الملفات محفوظة داخل متصفح هذا الجهاز</span></h2></div>
    ${reps.length ? `<div class="card-pad"><div class="rep-list">${reps.map(rp=>`
      <div class="rep">
        <div class="rep-ico">${rp.kind==='link'?IC.link:IC.pdf}</div>
        <div class="rep-meta"><div class="n">${esc(rp.name||'تقرير')}</div>
          <div class="d">${esc(officeLabel(rp._office))} · ${esc(PERIODS[rp.period]||'—')} · ${esc(fmtDate(rp.date))}${rp.size?' · '+esc(fmtSize(rp.size)):''}</div></div>
        <div class="row-actions no-print">
          <button class="btn btn-sm" data-rep-open="${rp.id}">${IC.eye} فتح</button>
          <button class="btn btn-sm btn-ghost" data-open="${rp._office.id}">المكتب</button>
        </div></div>`).join('')}</div></div>`
    : `<div class="empty">${IC.pdf}<div>لا تقارير بعد — افتح أي مكتب واسحب ملف PDF إلى صندوق التقارير.</div></div>`}
  </section>
  ${missing.length?`<section class="card"><div class="card-head"><h2>مكاتب لم تُرفع لها تقارير</h2></div>
    <div class="card-pad"><div style="display:flex;flex-wrap:wrap;gap:6px">${
      missing.map(o=>`<button class="tag warn" data-open="${o.id}" style="cursor:pointer">${esc(officeLabel(o))}</button>`).join('')
    }</div></div></section>`:''}`;
}

          <button class="btn" id="applyCount">تطبيق</button></div></div>

        <button class="btn" id="bulkName2">${IC.edit} تسمية جماعية للمكاتب</button>
        <button class="btn btn-ghost btn-danger" id="resetAll">${IC.trash} تفريغ كل البيانات والبدء من جديد</button>
      </div>
    </section>

    <section class="card">
      <div class="card-head"><h2>ملخّص الحالة</h2></div>
      <div class="card-pad">
        ${simpleTable(['البند','القيمة'], [
          ['عدد المكاتب', num(S.offices.length)],
          ['مكاتب مكتملة البيانات', num(t.filled)],
          ['عدد الموظفين', num(t.staff)],

<script>
/* ============================================================================
   الربط، النوافذ، التصدير/الاستيراد، الإقلاع
   ============================================================================ */
"use strict";

/* -------------------------------------------------------------- النوافذ */
let modalOnClose = null;
function openModal(title, body, foot, opts){
  if(RO() && !/تقرير/.test(title)) { toast('التعديل يتم من ملف Google Sheets فقط','info'); return document.createElement('div'); }
  const m = $('#modal');
  m.className = 'modal' + ((opts&&opts.wide)?' wide':'');
  m.innerHTML = `<div class="modal-head"><h3>${esc(title)}</h3>
      <button class="btn btn-icon btn-ghost" data-close>${IC.x}</button></div>
    <div class="modal-body">${body}</div>
    <div class="modal-foot">${foot||''}</div>`;
  $('#modalBg').classList.add('on');
  m.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeModal);
  const f = m.querySelector('input,select,textarea'); if(f) setTimeout(()=>f.focus(),40);
  return m;
}
function closeModal(){ $('#modalBg').classList.remove('on'); $('#modal').innerHTML=''; if(modalOnClose){modalOnClose();modalOnClose=null;} }
$('#modalBg').addEventListener('mousedown', e=>{ if(e.target.id==='modalBg') closeModal(); });
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeModal(); });

function confirmBox(title, msg, okLabel, cb, danger){
  openModal(title, `<div style="font-size:14px;line-height:1.8">${msg}</div>`,
    `<button class="btn ${danger?'btn-danger':'btn-primary'}" id="cfOk">${esc(okLabel)}</button>
     <button class="btn btn-ghost" data-close>إلغاء</button>`);
  $('#cfOk').onclick = ()=>{ closeModal(); cb(); };
}

/* ------------------------------------------------------- نموذج المكتب */
function officeForm(o){
  const isNew = !o;
  openModal(isNew?'إضافة مكتب':'تعديل بيانات المكتب', `
    <div class="form-grid">
      <div class="field"><label for="fCode">الرمز</label><input class="input" id="fCode" value="${esc(o?o.code:String(S.offices.length+1).padStart(2,'0'))}"></div>
      <div class="field"><label for="fName">اسم المكتب</label><input class="input" id="fName" value="${esc(o?o.name:'')}" placeholder="مثال: مكتب جاكرتا"></div>
      <div class="field"><label for="fCountry">الدولة</label><input class="input" id="fCountry" value="${esc(o?o.country:'')}"></div>
      <div class="field"><label for="fCity">المدينة</label><input class="input" id="fCity" value="${esc(o?o.city:'')}"></div>
      <div class="field"><label for="fMgr">مدير المكتب</label><input class="input" id="fMgr" value="${esc(o?o.manager:'')}"></div>
      <div class="field"><label for="fMail">البريد الإلكتروني</label><input class="input" id="fMail" type="email" value="${esc(o?o.email:'')}"></div>
      <div class="field"><label for="fH1">ميزانية النصف الأول</label><input class="input" id="fH1" type="number" step="any" min="0" value="${o?(Number(o.h1)||0):0}"></div>
      <div class="field"><label for="fH2">ميزانية النصف الثاني</label><input class="input" id="fH2" type="number" step="any" min="0" value="${o?(Number(o.h2)||0):0}"></div>
      <div class="field full"><label for="fNotes">ملاحظات</label><textarea class="input" id="fNotes" style="min-height:66px">${esc(o?o.notes:'')}</textarea></div>
    </div>`,
    `<button class="btn btn-primary" id="fSave">${IC.check} حفظ</button>
     <button class="btn btn-ghost" data-close>إلغاء</button>
     ${isNew?'':`<button class="btn btn-ghost btn-danger" id="fDel" style="margin-inline-start:auto">${IC.trash} حذف المكتب</button>`}`,
    {wide:true});
  $('#fSave').onclick = ()=>{
    const t = {
      code: $('#fCode').value.trim() || String(S.offices.length+1).padStart(2,'0'),
      name: $('#fName').value.trim(), country: $('#fCountry').value.trim(), city: $('#fCity').value.trim(),
      manager: $('#fMgr').value.trim(), email: $('#fMail').value.trim(),
      h1: clampNum($('#fH1').value), h2: clampNum($('#fH2').value), notes: $('#fNotes').value.trim()
    };
    if(isNew){ const n = Object.assign(blankOffice(S.offices.length+1), t); S.offices.push(n); CUR_OFFICE = n.id; }
    else Object.assign(o, t);
    save(true); closeModal(); toast(isNew?'أُضيف المكتب':'حُدّثت بيانات المكتب'); render();
  };
  if(!isNew) $('#fDel').onclick = ()=>confirmBox('حذف المكتب',
    `سيُحذف <b>${esc(officeLabel(o))}</b> مع ${num((o.employees||[]).length)} موظف و ${num((o.reports||[]).length)} تقرير. لا يمكن التراجع.`,
    'حذف نهائي', ()=>{
      (o.reports||[]).forEach(r=>r.fileId&&FileStore.del(r.fileId));
      S.offices = S.offices.filter(x=>x.id!==o.id); save(true); toast('حُذف المكتب','warn'); go('offices');
    }, true);
}

/* ------------------------------------------------------ نموذج الموظف */
function empForm(officeId, emp){
  const o = getOffice(officeId); if(!o) return;
  const isNew = !emp;
  const period = S.meta.salaryPeriod==='monthly'?'الشهري':'السنوي';
  openModal(isNew?'إضافة موظف':'تعديل بيانات الموظف', `
    <div class="form-grid">
      <div class="field full"><label for="eName">الاسم الكامل</label><input class="input" id="eName" value="${esc(emp?emp.name:'')}"></div>
      <div class="field"><label for="eId">الرقم الوظيفي</label><input class="input" id="eId" value="${esc(emp?(emp.empId||''):'')}" dir="ltr"></div>
      <div class="field"><label for="eTitle">المسمى الوظيفي</label><input class="input" id="eTitle" value="${esc(emp?emp.title:'')}" placeholder="مثال: مدير المكتب"></div>
      <div class="field"><label for="eDept">القسم</label><input class="input" id="eDept" value="${esc(emp?emp.dept:'')}"></div>
      <div class="field"><label for="eSal">الراتب ${esc(period)} (${esc(CUR())})</label><input class="input" id="eSal" type="number" step="any" min="0" value="${emp?(Number(emp.salary)||0):''}"></div>
      <div class="field"><label for="eType">نوع التعاقد</label>
        <select class="input" id="eType">
          ${['دوام كلي','دوام جزئي','دوام كامل','متعاون','متعاقد'].map(v=>`<option ${emp&&emp.type===v?'selected':''}>${v}</option>`).join('')}
        </select></div>
    </div>`,
    `<button class="btn btn-primary" id="eSave">${IC.check} حفظ</button>
     <button class="btn btn-ghost" data-close>إلغاء</button>`);
  $('#eSave').onclick = ()=>{
    const name = $('#eName').value.trim();
    if(!name){ toast('اكتب اسم الموظف','warn'); return; }
    const t = { name, empId:$('#eId').value.trim(), title:$('#eTitle').value.trim(), dept:$('#eDept').value.trim(),
                salary:clampNum($('#eSal').value), type:$('#eType').value };
    if(isNew){ o.employees.push(Object.assign({id:uid('e')}, t)); } else Object.assign(emp, t);
    save(true); closeModal(); toast(isNew?'أُضيف الموظف':'حُدّثت البيانات'); render();
  };
}

/* --------------------------------------------------- إضافة موظفين دفعة */
function bulkEmpForm(officeId){
  const o = getOffice(officeId); if(!o) return;
  openModal('إضافة موظفين دفعة واحدة', `
    <p style="margin:0 0 12px;font-size:13.5px;color:var(--text-secondary)">
      الصق سطراً لكل موظف بالترتيب: <b>الاسم | المسمى الوظيفي | الراتب | القسم</b><br>
      الفاصل: <code>|</code> أو فاصلة أو تاب. القسم والرقم الوظيفي (حقل خامس) اختياريان.</p>
    <textarea class="input" id="bulkTxt" style="min-height:190px;font-variant-numeric:tabular-nums"
      placeholder="محمد أحمد | مدير المكتب | 12000 | الإدارة
سارة علي | محاسب | 8500 | المالية"></textarea>
    <div class="mono-note" style="margin-top:8px">الراتب يُقرأ كأرقام فقط؛ أي رموز عملة تُتجاهل.</div>`,
    `<button class="btn btn-primary" id="bkSave">${IC.check} إضافة</button>
     <button class="btn btn-ghost" data-close>إلغاء</button>`, {wide:true});
  $('#bkSave').onclick = ()=>{

      <div class="field"><label for="rPeriod">الفترة</label>
        <select class="input" id="rPeriod">${Object.entries(PERIODS).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select></div>

      : `<div class="field full"><label for="rUrl">رابط التقرير (اختياري إذا كان الملف على Drive/SharePoint)</label>
          <input class="input" id="rUrl" type="url" placeholder="https://…" dir="ltr"></div>
         <div class="field full"><button class="btn" id="rPick">${IC.up} أو اختر ملف PDF من الجهاز</button></div>`}
    </div>`,
    `<button class="btn btn-primary" id="rSave">${IC.check} إضافة</button>
     <button class="btn btn-ghost" data-close>إلغاء</button>`, {wide:true});

  if(!files) $('#rPick').onclick = ()=>{ closeModal(); pickPDFs(officeId); };

                         period, date, fileId:id, size:f.size, mime:f.type||'application/pdf' });

async function openReport(rp){
  if(rp.kind==='link'){ window.open(rp.url,'_blank','noopener'); return; }
  const blob = await FileStore.get(rp.fileId);
  if(!blob){ toast('الملف غير متوفر في هذا الجهاز — استورد النسخة الكاملة','warn'); return; }
  const url = URL.createObjectURL(blob);
  window.open(url,'_blank','noopener');
  setTimeout(()=>URL.revokeObjectURL(url), 60000);
}
async function dlReport(rp){
  const blob = await FileStore.get(rp.fileId);
  if(!blob){ toast('الملف غير متوفر في هذا الجهاز','warn'); return; }
  saveBlob(blob, (rp.name||'تقرير')+'.pdf');
}
function findReport(id){

/* ------------------------------------------------------ تصدير / استيراد */
function saveBlob(blob, filename){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function stamp(){ return new Date().toISOString().slice(0,10); }
function exportData(){
  saveBlob(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}), `wamy-offices-${stamp()}.json`);
  toast('تم تصدير البيانات');
}
async function exportFull(){
  toast('جارٍ تجميع الملفات…','info');
  const clone = JSON.parse(JSON.stringify(S));
  clone.__files = {};
  for(const o of clone.offices){
    for(const r of (o.reports||[])){
      if(r.kind==='file' && r.fileId){
        const b = await FileStore.get(r.fileId);
        if(b) clone.__files[r.fileId] = await blobToB64(b);
      }
    }
  }
  saveBlob(new Blob([JSON.stringify(clone)],{type:'application/json'}), `wamy-offices-full-${stamp()}.json`);
  toast('تم تصدير النسخة الكاملة');
}
const blobToB64 = b => new Promise(res=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.readAsDataURL(b); });
function b64ToBlob(d){
  const [h,data] = String(d).split(',');
  const mime = (h.match(/:(.*?);/)||[,'application/pdf'])[1];
  const bin = atob(data); const u = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return new Blob([u],{type:mime});
}
function importData(){
  const inp = $('#jsonPicker'); inp.value='';
  inp.onchange = async ()=>{
    const f = inp.files[0]; if(!f) return;

      if(!p || !Array.isArray(p.offices)) throw new Error('bad');
      const files = p.__files || {}; delete p.__files;
      confirmBox('استيراد نسخة احتياطية',
        `الملف يحتوي <b>${num(p.offices.length)}</b> مكتب و <b>${num(p.offices.reduce((s,o)=>s+((o.employees||[]).length),0))}</b> موظف`
        + (Object.keys(files).length?` و <b>${num(Object.keys(files).length)}</b> ملف تقرير`:'')
        + `.<br><br>سيُستبدل كل ما هو موجود الآن في اللوحة. صدّر نسخة أولاً إن أردت الاحتفاظ به.`,
        'استيراد واستبدال', async ()=>{
          for(const [id,d] of Object.entries(files)){ try{ await FileStore.put(id, b64ToBlob(d)); }catch(e){} }
          S = migrate(p); save(true); toast('تم الاستيراد'); go('dash');
        });
    }catch(e){ toast('الملف غير صالح','warn'); }
  };
  inp.click();
}
function csv(rows, filename){
  const body = rows.map(r=>r.map(c=>{
    const s = String(c==null?'':c);
    return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
  }).join(',')).join('\r\n');
  saveBlob(new Blob(['﻿'+body],{type:'text/csv;charset=utf-8'}), filename);
  toast('تم التصدير');
}

let rpPrevTheme = null;

function openPerfReport(officeId){
  rpPrevTheme = document.documentElement.dataset.theme || 'light';
  document.documentElement.dataset.theme = 'light';   // التقرير دائماً بالوضع الفاتح
  const one = officeId ? getOffice(officeId) : null;
  $('#reportRoot').innerHTML = one ? buildOfficeReport(one) : buildPerfReport();
  document.body.classList.add('reporting');
  $('#rpPrint').onclick = ()=>window.print();
  $('#rpClose').onclick = closePerfReport;
  if(one){
    const ts = new Map();
    (one.employees||[]).forEach(e=>{ const k=(e.title||'غير محدد').trim();
      const g = ts.get(k)||{n:0,sal:0}; g.n++; g.sal+=(Number(e.salary)||0)*annualFactor(); ts.set(k,g); });
    const rows = [...ts.entries()].sort((a,b)=>b[1].sal-a[1].sal)
      .map(([k,v])=>({ label:k+' ('+v.n+')', total:v.sal, parts:[{name:'الرواتب السنوية', v:v.sal, color:'#1E88C7'}] }));
    stackedBars($('#rpO1'), rows, { rowH:26, barH:13, labelW:200 });
    $('#reportRoot').scrollTop = 0;
    return;
  }
  // الرسوم بعرض صفحة A4
  const w1 = $('#rpC1'), w2 = $('#rpC2');
  const rows = S.offices.filter(o=>officeTotal(o)>0).sort((a,b)=>officeTotal(b)-officeTotal(a)).slice(0,14);
  stackedBars(w1, rows.map(o=>({label:officeLabel(o), sub:o.country, total:officeTotal(o),
      parts:[{name:'النصف الأول',v:Number(o.h1)||0,color:'#1E88C7'},
             {name:'النصف الثاني',v:Number(o.h2)||0,color:'#EB6834'}]})), {rowH:26, barH:13});
  const rr = S.offices.filter(o=>ratio(o)!=null && ratio(o)>0).map(o=>({label:officeLabel(o), v:ratio(o)}))
             .sort((a,b)=>b.v-a.v).slice(0,14);
  const avg = rr.length ? rr.reduce((s,x)=>s+x.v,0)/rr.length : null;

  $('#reportRoot').scrollTop = 0;

  setInterval(()=>syncFromSheet(false), AUTO_REFRESH_MINUTES*60*1000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) syncFromSheet(false); });
})();
</script>
